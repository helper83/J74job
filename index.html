무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 건축·도시 기획·건축·실내 설계의 기초업무 수행 • 중기: 독립적으로 구조·법규 검토·도시·교통계획을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 설계·코드/도면 보조, 데이터 분석, 이상탐지, 시뮬레이션·문서화 자동화 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 전공기초·법규·도면/데이터 • 3개월: 설계·해석·환경/안전 프로젝트 • 6개월: 기사자격·현장실습·프로젝트 포트폴리오 • 대표 결과물: 역세권 개발대상지의 용도·교통·보행·공공공간 조건을 분석해 공간계획안을 작성 • 6개월 후 목표: 건축설계 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 공학적 문제해결을 활용하는 일을 비교적 즐긴다. □ 도면·데이터 해석이 요구되는 문제를 피하지 않는다. □ 건축·도시 기획 같은 활동에 흥미가 있다. □ autocad 등 직무 도구를 배우는 데 거부감이 적다. □ 건축사사무소 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 역세권 개발대상지의 용도·교통·보행·공공공간 조건을 분석해 공간계획안을 작성. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 1405 도시 및 교통 관련 전문가, 1404 조경 기술자, 1402 건축공학 기술자, 1401 건축가, 6110 부동산 컨설턴트 및 중개사 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한국환경공단 2026년 신입직원 채용 : https://job.alio.go.kr/recruitview.do?idx=304222 • 한국전기안전공사 2026년 하반기 공무직 채용 : https://job.alio.go.kr/recruitview.do?idx=304764 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J40","name":"토목설계·측량·공간정보","intro":[{"type":"p","text":"도로·철도·공항·하천 등 사회기반시설을 토목공학·측량·공간정보 기술로 설계하고 위치정보를 구축하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑪ 건설·시설·환경·에너지·안전"],["한 줄 정의","도로·철도·공항·하천 등 사회기반시설을 토목공학·측량·공간정보 기술로 설계하고 위치정보를 구축하는 직무"],["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["대표 시장직무명","토목설계, 측량, GIS, 공간정보, 지적, Civil Engineer"],["주요 산업","엔지니어링, 건설, 공공기관, 공간정보, 인프라"],["NCS 기반","대 수행하면 실제 업무가 어떻게 달라지는가?’ 13. 실제 채용검색 키워드·유사직무 • 검색 키워드: 토목설계, 측량, gis, 공간정보, 지적, civil engineer • 유사·인접 직무: j39 건축·도시·조경, j41 건설시공·현장관리, j42 건설설비·플랜트 • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 토목설계·측량·지적의 기초업무 수행 • 중기: 독립적으로 gis·공간정보 구축·수리·구조 해석을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 설계·코드/도면 보조, 데이터 분석, 이상탐지, 시뮬레이션·문서화 자동화 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 전공기초·법규·도면/데이터 • 3개월: 설계·해석·환경/안전 프로젝트 • 6개월: 기사자격·현장실습·프로젝트 포트폴리오 • 대표 결과물: 도로 신설구간의 지형·교통·환경 자료를 gis로 분석하고 선형·구조물 설계안을 도출 • 6개월 후 목표: 토목설계 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 공학적 문제해결을 활용하는 일을 비교적 즐긴다. □ 도면·데이터 해석이 요구되는 문제를 피하지 않는다. □ 토목설계 같은 활동에 흥미가 있다. □ autocad/civil 3d 등 직무 도구를 배우는 데 거부감이 적다. □ 엔지니어링 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 도로 신설구간의 지형·교통·환경 자료를 gis로 분석하고 선형·구조물 설계안을 도출. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 1403 토목공학 기술자, 1406 측량 및 공간정보 전문가, 7059 기타 채굴 및 토목 관련 종사원 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한국환경공단 2026년 신입직원 채용 : https://job.alio.go.kr/recruitview.do?idx=304222 • 한국전기안전공사 2026년 하반기 공무직 채용 : https://job.alio.go.kr/recruitview.do?idx=304764 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J41","name":"건설시공·현장관리","intro":[{"type":"p","text":"건설현장에서 공정·원가·품질·안전·협력업체를 관리하며 설계도서를 실제 구조물로 완성하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑪ 건설·시설·환경·에너지·안전"],["한 줄 정의","건설현장에서 공정·원가·품질·안전·협력업체를 관리하며  • 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 설계도서·도면 또는 포트폴리오 • 자격·교육: 기사급 자격(건축·토목·건설안전·설비 등 직무별) 11. 신입 진입도와 현실적 진입경로 신입 진입도 ★★★★★ 양호(신입·현장형 진입기회가 비교적 넓음) 직접 진입 시설관리, 설비관리, maintenance 신입·인턴 공고 탐색 경유 진입 j42 건설설비·플랜트, j44 환경·기후·생태, j41 건설시공·현장관리 등 인접 직무에서 경험 후 이동 가능 선발 evidence 전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 star 방식으로 제시 12. 산업 연계 • 주요 진출 산업: 빌딩, 공장, 철도, 병원, 공공시설 • 같은 직무라도 산업에 따라 제품·고객·법규·기술·kpi가 달라지므로 i66 산업과 결합해 탐색하는 것이 효과적. • 학생 질문 예: ‘시설관리·유지보수을 빌딩 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’ 13. 실제 채용검색 키워드·유사직무 • 검색 키워드: 시설관리, 설비관리, maintenance, fm, 기계설비 유지관리, facility engineer • 유사·인접 직무: j42 건설설비·플랜트, j44 환경·기후·생태, j41 건설시공·현장관리 • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 시설점검·예방·고장 정비의 기초업무 수행 • 중기: 독립적으로 설비운전·보수공사 관리을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 설계·코드/도면 보조, 데이터 분석, 이상탐지, 시뮬레이션·문서화 자동화 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 전공기초·법규·도면/데이터 • 3개월: 설계·해석·환경/안전 프로젝트 • 6개월: 기사자격·현장실습·프로젝트 포트폴리오 • 대표 결과물: 설비 고장 이력과 에너지 사용량을 분석해 예방정비 주기와 교체 우선순위를 재설계 • 6개월 후 목표: 시설관리 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 공학적 문제해결을 활용하는 일을 비교적 즐긴다. □ 도면·데이터 해석이 요구되는 문제를 피하지 않는다. □ 시설점검 같은 활동에 흥미가 있다. □ cmms 등 직무 도구를 배우는 데 거부감이 적다. □ 빌딩 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 설비 고장 이력과 에너지 사용량을 분석해 예방정비 주기와 교체 우선순위를 재설계. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 7031 건설 배관공, 5420 건물 관리원, 8116 보일러 설치 및 정비원 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한국환경공단 2026년 신입직원 채용 : https://job.alio.go.kr/recruitview.do?idx=304222 • 한국전기안전공사 2026년 하반기 공무직 채용 : https://job.alio.go.kr/recruitview.do?idx=304764 • 세계경제포럼 future of jobs report 2025 :  포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 공학적 문제해결을 활용하는 일을 비교적 즐긴다. □ 도면·데이터 해석이 요구되는 문제를 피하지 않는다. □ 위험성평가 같은 활동에 흥미가 있다. □ 안전관리시스템 등 직무 도구를 배우는 데 거부감이 적다. □ 제조 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 공정별 위험요인을 빈도·강도로 평가하고 설비·작업절차·교육 개선대책을 수립. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 1555 환경공학 기술자 및 연구원, 1551 가스·에너지 기술자 및 연구원, 1584 산업안전 및 산업위험 관리 기술자 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한국환경공단 2026년 신입직원 채용 : https://job.alio.go.kr/recruitview.do?idx=304222 • 한국전기안전공사 2026년 하반기 공무직 채용 : https://job.alio.go.kr/recruitview.do?idx=304764 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J47","name":"구매·조달·자재","intro":[{"type":"p","text":"생산과 사업에 필요한 원재료·부품·서비스를 적기·적정가격·적정품질로 확보하고 공급업체와 자재를 관리하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑫ 제조·생산·공정·품질·정비"],["한 줄 정의","생산과 사업에 필요한 원재료·부품·서비스를 적기·적정가격·적정품질로 확보하고 공급업체와 자재를 관리하는 직무"],["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["대표 시장직무명","구매, 조달, 자재관리, Strategic Sourcing, Buyer, Procurement"],["주요 산업","제조, 건설, IT, 공공기관, 유통"],["NCS 기반","대표 NCS: 구매관리, 자재관리, 기계조달, 기계자재관리, 구매생산관리 / 매핑 세분류 5개 / 능력단위 44개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["구매","구매전략·소싱","구매전략·소싱 관련 자료정리·운영지원·기초분석·현장보조"],["조달","협력사 발굴·평가","협력사 발굴·평가 관련 자료정리·운영지원·기초분석·현장보조"],["자재","원가·가격 협상","원가·가격 협상 관련 자료정리·운영지원·기초분석·현장보조"]]}],"3. 주요 업무":[{"type":"p","text":"• 구매전략·소싱","style":"Body Compact"},{"type":"p","text":"• 협력사 발굴·평가","style":"Body Compact"},{"type":"p","text":"• 원가·가격 협상","style":"Body Compact"},{"type":"p","text":"• 발주·납기 관리","style":"Body Compact"},{"t  맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 공정·품질·도면·재료 기초 • 3개월: 설계/공정개선/품질 프로젝트 • 6개월: 기사·현장실습·캡스톤/산학프로젝트 • 대표 결과물: 공정별 불량률과 설비조건을 분석해 원인을 찾고 표준조건과 검사계획을 개선 • 6개월 후 목표: 생산관리 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 공학적 분석을 활용하는 일을 비교적 즐긴다. □ 문제해결이 요구되는 문제를 피하지 않는다. □ 생산계획 같은 활동에 흥미가 있다. □ mes 등 직무 도구를 배우는 데 거부감이 적다. □ 자동차 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 공정별 불량률과 설비조건을 분석해 원인을 찾고 표준조건과 검사계획을 개선. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 0285 생산 및 품질관리 사무원, 1513 기계 및 로봇공학 시험원 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 현대자동차 2026년 9월 신입 채용(품질·생산기술·r&d) : https://talent.hyundai.com/apply/applylist.hc • 현대자동차 직무소개(구매/부품개발·품질) : https://talent.hyundai.com/team/view.hc?category=job • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J49","name":"기계설계·금형·가공·로봇","intro":[{"type":"p","text":"기계·금형·로봇 구조와 부품을 설계하고 가공·조립·시험을 통해 요구 성능을 구현하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑫ 제조·생산·공정·품질·정비"],["한 줄 정의","기계·금형·로봇 구조와 부품을 설계하고 가공·조립·시험을 통해 요구 성능을 구현하는 직무"],["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["대표 시장직무명","기계설계, 금형설계, 기구설계, 로봇기구, CAM, Mechanical Engineer"],["주요 산업","기계, 자동차, 로봇, 전자, 금형"],["NCS 기반","대표 NCS: 금형스마트시스템운영·관리, 다이캐스팅금형설계, 다이캐스팅금형제작, 다이캐스팅금형조립, 사출금형설계, 사출금형제작, 사출금형조립, 프레스금형설계 / 매핑 세분류 39개 / 능력단위 468개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["기계설계","기계·부품 설계","기계·부품 설계 관련 자료정리·운영지원·기초분석·현장보조"],["금형","금형설계·제작","금형설계·제작 관련 자료정리·운영지원·기초분석·현장보조"],["가공","가공공정 설계","가공공정 설계 관련 자료정리·운 료 기초 • 3개월: 설계/공정개선/품질 프로젝트 • 6개월: 기사·현장실습·캡스톤/산학프로젝트 • 대표 결과물: 전동차 고장 이력을 분석해 반복고장 부품의 예방정비 주기와 점검항목을 조정 • 6개월 후 목표: 철도차량설계 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 공학적 분석을 활용하는 일을 비교적 즐긴다. □ 문제해결이 요구되는 문제를 피하지 않는다. □ 철도차량 설계 같은 활동에 흥미가 있다. □ cad 등 직무 도구를 배우는 데 거부감이 적다. □ 철도차량 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 전동차 고장 이력을 분석해 반복고장 부품의 예방정비 주기와 점검항목을 조정. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 8116 보일러 설치 및 정비원, 1511 기계공학 기술자 및 연구원, 8123 철도 기관차 및 전동차 정비원 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 현대자동차 2026년 9월 신입 채용(품질·생산기술·r&d) : https://talent.hyundai.com/apply/applylist.hc • 현대자동차 직무소개(구매/부품개발·품질) : https://talent.hyundai.com/team/view.hc?category=job • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J54","name":"항공·무인기 제조·정비","intro":[{"type":"p","text":"항공기·무인기의 기체·추진·전기전자·제어 시스템을 설계·제작·시험·정비해 비행 안전과 성능을 확보하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑫ 제조·생산·공정·품질·정비"],["한 줄 정의","항공기·무인기의 기체·추진·전기전자·제어 시스템을 설계·제작·시험·정비해 비행 안전과 성능을 확보하는 직무"],["신입 진입도","★★★☆☆ 보통~다소 어려움(직무증거·전문성 중요)"],["대표 시장직무명","항공기설계, UAV Engineer, 항공정비, 항공전자, 비행시험, Aerospace Engineer"],["주요 산업","항공우주, 방산, 드론, 항공사 정비, 연구기관"],["NCS 기반","대표 NCS: 소형무인기비행체개발, 항공기기체설계, 항공기시스템설계, 항공기엔진·프로펠러설계, 항공기전기·전자장비설계, 소형무인기정비, 항공기가스터빈엔진정비, 항공기계통정비 / 매핑 세분류 19개 / 능력단위 208개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["항공","항공기체·시스템 설계","항공기체·시스템 설계 관련 자료정리·운영지원·기초분석·현장보조"],["무인기 제조","엔진·추진 설계","엔진·추진 설계 관련 자료정리·운영지원·기초분석·현장보조"],["정비","무인기 개발","무인기 개발 관련 자료정리·운영지원·기초분석·현장보조"]]}],"3. 주요 업무":[{"type":"p","text":"• 항공기체· 정비 • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 항공기체·시스템 설계·엔진·추진 설계의 기초업무 수행 • 중기: 독립적으로 무인기 개발·제작·조립을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 설계·코드/도면 보조, 데이터 분석, 이상탐지, 시뮬레이션·문서화 자동화 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 공정·품질·도면·재료 기초 • 3개월: 설계/공정개선/품질 프로젝트 • 6개월: 기사·현장실습·캡스톤/산학프로젝트 • 대표 결과물: 소형 무인기의 임무 요구조건을 바탕으로 중량·비행시간·추진·제어 시스템을 설계하고 시험 • 6개월 후 목표: 항공기설계 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 공학적 분석을 활용하는 일을 비교적 즐긴다. □ 문제해결이 요구되는 문제를 피하지 않는다. □ 항공기체·시스템 설계 같은 활동에 흥미가 있다. □ catia 등 직무 도구를 배우는 데 거부감이 적다. □ 항공우주 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 소형 무인기의 임무 요구조건을 바탕으로 중량·비행시간·추진·제어 시스템을 설계하고 시험. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 8121 항공기 정비원 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 현대자동차 2026년 9월 신입 채용(품질·생산기술·r&d) : https://talent.hyundai.com/apply/applylist.hc • 현대자동차 직무소개(구매/부품개발·품질) : https://talent.hyundai.com/team/view.hc?category=job • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J55","name":"금속·재료·용접·제련","intro":[{"type":"p","text":"금속·합금·용접 소재의 조성·조직·성질을 설계·시험하고 제련·압연·용접 공정을 관리하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑫ 제조·생산·공정·품질·정비"],["한 줄 정의","금속·합금·용접 소재의 조성·조직·성질을 설계·시험하고 제련·압연·용접 공정을 관리하는 직무"],["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["대표 시장직무명","재료연구, 금속공정, 용접엔지니어, 열처리, Metallurgy, Materials Engineer"],["주요 산업","철강, 자동차, 조선, 항공, 소재기업"],["NCS 기반","대표  기계","style":"Body Compact"},{"type":"p","text":"• 비전공자: 가능 여부는 직무별 자격·면허·기술장벽에 따라 다름. 전공을 대신할 프로젝트·도구·자격·인턴 Evidence를 확보해야 함.","style":"Body Compact"},{"type":"p","text":"• 추천 전략: 철강 분야를 정해 산업지식 + 직무기술을 결합하면 지원서의 구체성이 높아짐.","style":"Body Compact"}],"10. 추천 경험·포트폴리오·자격":[{"type":"p","text":"• 재료설계 관련 수업/팀프로젝트","style":"Body Compact"},{"type":"p","text":"• 금속조직·물성시험을 직접 수행한 산학·공모전·개인프로젝트","style":"Body Compact"},{"type":"p","text":"• 철강 기업/기관의 인턴·현장실습·직무체험","style":"Body Compact"},{"type":"p","text":"• 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 도면·공정표준 또는 포트폴리오","style":"Body Compact"},{"type":"p","text":"• 자격·교육: 관련 기사·산업기사 및 캡스톤/실험 프로젝트","style":"Body Compact"}],"11. 신입 진입도와 현실적 진입경로":[{"type":"table","rows":[["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["직접 진입","재료연구, 금속공정, 용접엔지니어 신입·인턴 공고 탐색"],["경유 진입","J54 항공·무인기 제조·정비, J56 비금속·세라믹·탄소소재, J53 철도차량 제조·정비 등 인접 직무에서 경험 후 이동 가능"],["선발 Evidence","전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 STAR 방식으로 제시"]]}],"12. 산업 연계":[{"type":"p","text":"• 주요 진출 산업: 철강, 자동차, 조선, 항공, 소재기업","style":"Body Compact"},{"type":"p","text":"• 같은 직무라도 산업에 따라 제품·고객·법규·기술·KPI가 달라지므로 I66 산업과 결합해 탐색하는 것이 효과적.","style":"Body Compact"},{"type":"p","text":"• 학생 질문 예: ‘금속·재료·용접·제련을 철강 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’","style":"Body Compact"}],"13. 실제 채용검색 키워드·유사직무":[{"type":"p","text":"• 검색 키워드: 재료연구, 금속공정, 용접엔지니어, 열처리, Metallurgy, Materials Engineer","style":"Body Compact"},{"type":"p","text":"• 유사·인접 직무: J54 항공·무인기 제조·정비, J56 비금속·세라믹·탄소소재, J53 철도차량 제조·정비","style":"Body Compact"},{"type":"p","text":"• 검색 팁: J74 정식명칭 하나만 검색하지 말고 기업별 Alias(영문명·통합직무·사업부 직무명)까지 함께 검색","style":"Body Compact"}],"14. 커리어패스":[{"type":"p","text":"• 초기: Junior/Staff/Assistant 수준에서 재료설계·금속조직·물성시험의 기초업무 수행","style":"Body Compact"},{"type":"p","text":"• 중기: 독립적으로 제선·제강·압연·열처리을 책임지는 Specialist/Senior","style":"Body Compact"},{"type":"p","text":"• 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장","style":"Body Compact"}],"15. AI·자동화 영향":[{"type":"table","rows":[["AI가 빠르게 보조할 업무","설계·코드/도면 보조, 데이터 분석, 이상탐지, 업에서 수행하면 실제 업무가 어떻게 달라지는가?’ 13. 실제 채용검색 키워드·유사직무 • 검색 키워드: 재료연구, 금속공정, 용접엔지니어, 열처리, metallurgy, materials engineer • 유사·인접 직무: j54 항공·무인기 제조·정비, j56 비금속·세라믹·탄소소재, j53 철도차량 제조·정비 • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 재료설계·금속조직·물성시험의 기초업무 수행 • 중기: 독립적으로 제선·제강·압연·열처리을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 설계·코드/도면 보조, 데이터 분석, 이상탐지, 시뮬레이션·문서화 자동화 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 공정·품질·도면·재료 기초 • 3개월: 설계/공정개선/품질 프로젝트 • 6개월: 기사·현장실습·캡스톤/산학프로젝트 • 대표 결과물: 용접부 파손 시 조직·경도·결함 데이터를 분석해 용접조건과 후열처리 개선안을 제시 • 6개월 후 목표: 재료연구 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 공학적 분석을 활용하는 일을 비교적 즐긴다. □ 문제해결이 요구되는 문제를 피하지 않는다. □ 재료설계 같은 활동에 흥미가 있다. □ 재료분석장비 등 직무 도구를 배우는 데 거부감이 적다. □ 철강 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 용접부 파손 시 조직·경도·결함 데이터를 분석해 용접조건과 후열처리 개선안을 제시. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 1521 금속·재료공학 기술자 및 연구원, 8242 용접기 조작원, 8233 주조원, 1522 금속 및 재료공학 시험원, 8234 주조기 조작원 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 현대자동차 2026년 9월 신입 채용(품질·생산기술·r&d) : https://talent.hyundai.com/apply/applylist.hc • 현대자동차 직무소개(구매/부품개발·품질) : https://talent.hyundai.com/team/view.hc?category=job • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J56","name":"비금속·세라믹·탄소소재","intro":[{"type":"p","text":"세라믹·유리·탄소 등 비금속 소재의 원료·성형·소성·가공 공정을 설계하고 성능을 평가하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑫ 제조·생산·공정·품질·정비"],["한  찾고 표준·품질·납기를 관리"],["잘 맞는 학생","공학적 분석·문제해결을 강점으로 쓰고, 원료·조성 설계 같은 문제를 탐구/실행하는 학생"],["주의할 점","직무명만 보고 선택하지 말고 실제 현장·근무시간·자격·성과압력·고객접점 여부를 채용공고로 확인"]]}],"9. 관련 전공과 비전공자 진입":[{"type":"p","text":"• 관련 전공: 세라믹, 신소재, 재료, 화학, 탄소소재","style":"Body Compact"},{"type":"p","text":"• 비전공자: 가능 여부는 직무별 자격·면허·기술장벽에 따라 다름. 전공을 대신할 프로젝트·도구·자격·인턴 Evidence를 확보해야 함.","style":"Body Compact"},{"type":"p","text":"• 추천 전략: 세라믹 분야를 정해 산업지식 + 직무기술을 결합하면 지원서의 구체성이 높아짐.","style":"Body Compact"}],"10. 추천 경험·포트폴리오·자격":[{"type":"p","text":"• 원료·조성 설계 관련 수업/팀프로젝트","style":"Body Compact"},{"type":"p","text":"• 성형을 직접 수행한 산학·공모전·개인프로젝트","style":"Body Compact"},{"type":"p","text":"• 세라믹 기업/기관의 인턴·현장실습·직무체험","style":"Body Compact"},{"type":"p","text":"• 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 도면·공정표준 또는 포트폴리오","style":"Body Compact"},{"type":"p","text":"• 자격·교육: 직무 관련 교육·프로젝트 우선, 자격은 채용공고 우대요건 확인","style":"Body Compact"}],"11. 신입 진입도와 현실적 진입경로":[{"type":"table","rows":[["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["직접 진입","세라믹연구, 탄소소재, 유리공정 신입·인턴 공고 탐색"],["경유 진입","J55 금속·재료·용접·제련, J57 화학·고분자·공정제조, J54 항공·무인기 제조·정비 등 인접 직무에서 경험 후 이동 가능"],["선발 Evidence","전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 STAR 방식으로 제시"]]}],"12. 산업 연계":[{"type":"p","text":"• 주요 진출 산업: 세라믹, 배터리 소재, 반도체 소재, 유리, 탄소","style":"Body Compact"},{"type":"p","text":"• 같은 직무라도 산업에 따라 제품·고객·법규·기술·KPI가 달라지므로 I66 산업과 결합해 탐색하는 것이 효과적.","style":"Body Compact"},{"type":"p","text":"• 학생 질문 예: ‘비금속·세라믹·탄소소재을 세라믹 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’","style":"Body Compact"}],"13. 실제 채용검색 키워드·유사직무":[{"type":"p","text":"• 검색 키워드: 세라믹연구, 탄소소재, 유리공정, 비금속재료, Process Engineer, Materials R&D","style":"Body Compact"},{"type":"p","text":"• 유사·인접 직무: J55 금속·재료·용접·제련, J57 화학·고분자·공정제조, J54 항공·무인기 제조·정비","style":"Body Compact"},{"type":"p","text":"• 검색 팁: J74 정식명칭 하나만 검색하지 말고 기업별 Alias(영문명·통합직무·사업부 직무명)까지 함께 검색","style":"Body Compact"}],"14. 커리어패스":[{"type":"p","text":"• 초기: Junior/Staff/Assistant 수준에서 원료·조성 설계·성형의 기초업무 수행","style":"Body Compact"},{"type":"p","text":"• 중기: 독립적으로 소성·소결·용융 직접 진입 세라믹연구, 탄소소재, 유리공정 신입·인턴 공고 탐색 경유 진입 j55 금속·재료·용접·제련, j57 화학·고분자·공정제조, j54 항공·무인기 제조·정비 등 인접 직무에서 경험 후 이동 가능 선발 evidence 전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 star 방식으로 제시 12. 산업 연계 • 주요 진출 산업: 세라믹, 배터리 소재, 반도체 소재, 유리, 탄소 • 같은 직무라도 산업에 따라 제품·고객·법규·기술·kpi가 달라지므로 i66 산업과 결합해 탐색하는 것이 효과적. • 학생 질문 예: ‘비금속·세라믹·탄소소재을 세라믹 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’ 13. 실제 채용검색 키워드·유사직무 • 검색 키워드: 세라믹연구, 탄소소재, 유리공정, 비금속재료, process engineer, materials r&d • 유사·인접 직무: j55 금속·재료·용접·제련, j57 화학·고분자·공정제조, j54 항공·무인기 제조·정비 • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 원료·조성 설계·성형의 기초업무 수행 • 중기: 독립적으로 소성·소결·용융·가공을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 설계·코드/도면 보조, 데이터 분석, 이상탐지, 시뮬레이션·문서화 자동화 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 공정·품질·도면·재료 기초 • 3개월: 설계/공정개선/품질 프로젝트 • 6개월: 기사·현장실습·캡스톤/산학프로젝트 • 대표 결과물: 소결온도와 조성 변화가 강도·밀도에 미치는 영향을 실험해 최적 공정조건을 도출 • 6개월 후 목표: 세라믹연구 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 공학적 분석을 활용하는 일을 비교적 즐긴다. □ 문제해결이 요구되는 문제를 피하지 않는다. □ 원료·조성 설계 같은 활동에 흥미가 있다. □ 재료분석장비 등 직무 도구를 배우는 데 거부감이 적다. □ 세라믹 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 소결온도와 조성 변화가 강도·밀도에 미치는 영향을 실험해 최적 공정조건을 도출. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 8261 유리 제조 및 가공기 조작원, 1521 금속·재료공학 기술자 및 연구원 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 현대자동차 2026년 9월 신입 채용(품질·생산기술·r&d) : https://talent.hyundai.com/apply/applylist.hc • 현대자동차 직무소개(구매/부품개발·품질) : https://talent.hyundai.com/team/view.hc?category=job • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www 자, 신소재, 재료 • 비전공자: 가능 여부는 직무별 자격·면허·기술장벽에 따라 다름. 전공을 대신할 프로젝트·도구·자격·인턴 evidence를 확보해야 함. • 추천 전략: 석유화학 분야를 정해 산업지식 + 직무기술을 결합하면 지원서의 구체성이 높아짐. 10. 추천 경험·포트폴리오·자격 • 화학제품 r&d 관련 수업/팀프로젝트 • 공정설계을 직접 수행한 산학·공모전·개인프로젝트 • 석유화학 기업/기관의 인턴·현장실습·직무체험 • 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 도면·공정표준 또는 포트폴리오 • 자격·교육: 관련 기사·산업기사 및 캡스톤/실험 프로젝트 11. 신입 진입도와 현실적 진입경로 신입 진입도 ★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨) 직접 진입 화학공정, 공정기술, 화학r&d 신입·인턴 공고 탐색 경유 진입 j56 비금속·세라믹·탄소소재, j58 바이오·의약·화장품, j55 금속·재료·용접·제련 등 인접 직무에서 경험 후 이동 가능 선발 evidence 전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 star 방식으로 제시 12. 산업 연계 • 주요 진출 산업: 석유화학, 정밀화학, 배터리 소재, 플라스틱, 화학소재 • 같은 직무라도 산업에 따라 제품·고객·법규·기술·kpi가 달라지므로 i66 산업과 결합해 탐색하는 것이 효과적. • 학생 질문 예: ‘화학·고분자·공정제조을 석유화학 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’ 13. 실제 채용검색 키워드·유사직무 • 검색 키워드: 화학공정, 공정기술, 화학r&d, 분석, 고분자개발, chemical engineer • 유사·인접 직무: j56 비금속·세라믹·탄소소재, j58 바이오·의약·화장품, j55 금속·재료·용접·제련 • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 화학제품 r&d·공정설계의 기초업무 수행 • 중기: 독립적으로 반응·분리공정 운전·분석·검사을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 설계·코드/도면 보조, 데이터 분석, 이상탐지, 시뮬레이션·문서화 자동화 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 공정·품질·도면·재료 기초 • 3개월: 설계/공정개선/품질 프로젝트 • 6개월: 기사·현장실습·캡스톤/산학프로젝트 • 대표 결과물: 반응 수율과 불순물 데이터를 분석해 온도·압력·촉매 조건을 최적화 • 6개월 후 목표: 화학공정 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 공학적 분석을 활용하는 일을 비교적 즐긴다. □ 문제해결이 요구되는 문제를 피하지 않는다. □ 화학제품 r&d 같은 활동에 흥미가 있다. □ aspen plus 등 직무 도구를 배우는 데 거부감이 적다. □ 석유화학 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 반응 수율과 불순물 데이터를 분석해 온도·압력·촉매 조건을 최적화. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 1541 화학공학 기술자 및 연구원, 8521 타이어 및 고무제품 생산기 조작원, 8511 석유 및 천연가스 제조 관련 제어 장치 조작원, 8522 플라스틱제품 원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 공학적 분석을 활용하는 일을 비교적 즐긴다. □ 문제해결이 요구되는 문제를 피하지 않는다. □ 식품공정 운영 같은 활동에 흥미가 있다. □ haccp 시스템 등 직무 도구를 배우는 데 거부감이 적다. □ 식품제조 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 미생물·관능·공정 데이터를 분석해 신제품의 배합과 살균조건을 확정. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 1571 식품공학 기술자 및 연구원, 8711 제과원 및 제빵사, 8721 정육 가공원 및 도축원, 8722 김치 및 밑반찬 제조 종사원, 8735 음료 제조 관련 기계 조작원 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 현대자동차 2026년 9월 신입 채용(품질·생산기술·r&d) : https://talent.hyundai.com/apply/applylist.hc • 현대자동차 직무소개(구매/부품개발·품질) : https://talent.hyundai.com/team/view.hc?category=job • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J61","name":"인쇄·목재·가구·공예 제조","intro":[{"type":"p","text":"인쇄·목재·가구·간판·공예 제품을 설계·가공·인쇄·조립·마감해 물리적 제품과 시각물을 제작하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑫ 제조·생산·공정·품질·정비"],["한 줄 정의","인쇄·목재·가구·간판·공예 제품을 설계·가공·인쇄·조립·마감해 물리적 제품과 시각물을 제작하는 직무"],["신입 진입도","★★★★★ 양호(신입·현장형 진입기회가 비교적 넓음)"],["대표 시장직무명","인쇄기술, 가구제작, 목공, 간판제작, 공예가, Production Designer"],["주요 산업","인쇄, 가구, 인테리어, 사인, 공예"],["NCS 기반","대표 NCS: 출판물제작·공정관리, 프리프레스, 평판인쇄, 특수인쇄, 인쇄후가공, 간판디자인·제작·설치, 칠공예, 도자공예 / 매핑 세분류 21개 / 능력단위 367개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["인쇄","인쇄 전처리·출력","인쇄 전처리·출력 관련 자료정리·운영지원·기초분석·현장보조"],["목재","가구·목재 설계·가공","가구·목재 설계·가공 관련 자료정리·운영지원·기초분석·현장보조"],["가구","간판 제작·설치","간판 제작·설치 관련 자료정리·운영지원·기초분석·현장보조"],["공예 제조","공예 제작","공예 제작 관련 자료정리·운영지원·기초분석·현장보조"]]}],"3. 주요 업무":[{"type":"p","text":"• 인쇄 전처리·출력","style":"Body Compact"},{"type":"p","text":"• 가구·목재 설계·가공","style":"Body Compact" 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 설계·코드/도면 보조, 데이터 분석, 이상탐지, 시뮬레이션·문서화 자동화 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 공정·품질·도면·재료 기초 • 3개월: 설계/공정개선/품질 프로젝트 • 6개월: 기사·현장실습·캡스톤/산학프로젝트 • 대표 결과물: 가구 도면과 자재 사양을 바탕으로 cnc 가공·조립·마감 공정을 계획하고 품질을 검사 • 6개월 후 목표: 인쇄기술 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 공학적 분석을 활용하는 일을 비교적 즐긴다. □ 문제해결이 요구되는 문제를 피하지 않는다. □ 인쇄 전처리·출력 같은 활동에 흥미가 있다. □ adobe cc 등 직무 도구를 배우는 데 거부감이 적다. □ 인쇄 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 가구 도면과 자재 사양을 바탕으로 cnc 가공·조립·마감 공정을 계획하고 품질을 검사. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 8811 인쇄 관련 기계 조작원, 8841 공예원, 8842 귀금속 및 보석 세공원, 8852 간판 제작 및 설치원, 8831 가구 제조 및 수리원 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 현대자동차 2026년 9월 신입 채용(품질·생산기술·r&d) : https://talent.hyundai.com/apply/applylist.hc • 현대자동차 직무소개(구매/부품개발·품질) : https://talent.hyundai.com/team/view.hc?category=job • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J62","name":"전기·전력·발전·송배전","intro":[{"type":"p","text":"발전·송전·배전·전력설비를 설계·운영·정비해 안정적이고 안전한 전력 공급을 유지하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑬ 전기·전자·반도체·IT·통신"],["한 줄 정의","발전·송전·배전·전력설비를 설계·운영·정비해 안정적이고 안전한 전력 공급을 유지하는 직무"],["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["대표 시장직무명","전력계통, 발전운영, 송배전, 전기설비, 전력기술, Power Engineer"],["주요 산업","발전, 전력공기업, 신재생, 플랜트, 산업시설"],["NCS 기반","대표 NCS: 수력발전설비설계, 원자력발전설비설계, 화력발전설비설계, 수력발전설비운영, 원자력발전계측제어설비정비, 원자력발전기계설비정비, 원자력발전설비운영, 원자력발전전기설비정비 / 매핑 세분류 23개 / 능력단위 275개"]]}],"2. 세부 직무와 핵심 초점":[{ 요 진출 산업: 발전, 전력공기업, 신재생, 플랜트, 산업시설 • 같은 직무라도 산업에 따라 제품·고객·법규·기술·kpi가 달라지므로 i66 산업과 결합해 탐색하는 것이 효과적. • 학생 질문 예: ‘전기·전력·발전·송배전을 발전 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’ 13. 실제 채용검색 키워드·유사직무 • 검색 키워드: 전력계통, 발전운영, 송배전, 전기설비, 전력기술, power engineer • 유사·인접 직무: j63 자동화·제어·전기설비·ess, j64 전자·광학·하드웨어, j65 반도체·디스플레이 • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 발전설비 운영·송배전 설계·운영의 기초업무 수행 • 중기: 독립적으로 전력계통 분석·보호·계전을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 설계·코드/도면 보조, 데이터 분석, 이상탐지, 시뮬레이션·문서화 자동화 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 전공 핵심과 실습환경 구축 • 3개월: git/회로/데이터/인프라 등 직무 프로젝트 • 6개월: 포트폴리오·자격·인턴·오픈소스/캡스톤 • 대표 결과물: 부하·고장 데이터를 분석해 변전설비 보호계전 설정과 정비 우선순위를 검토 • 6개월 후 목표: 전력계통 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 논리·분석을 활용하는 일을 비교적 즐긴다. □ 기술학습이 요구되는 문제를 피하지 않는다. □ 발전설비 운영 같은 활동에 흥미가 있다. □ etap/psse 등 직무 도구를 배우는 데 거부감이 적다. □ 발전 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 부하·고장 데이터를 분석해 변전설비 보호계전 설정과 정비 우선순위를 검토. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 8330 발전 및 배전 장치 조작원, 8340 전기 및 전자설비 조작원, 8329 기타 전기·전자기기 설치 및 수리원, 8313 외선 전기공 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한전kdn 2026년 신입사원 채용 : https://job.alio.go.kr/recruitview.do?idx=298369 • 현대자동차 2026년 채용(it·data·infra·security 직무 체계) : https://talent.hyundai.com/apply/applylist.hc • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J63","name":"자동화·제어·전기설비·ESS","intro":[{"type":"p","text":"공장·건물·에너지시스템의 전기설비·자동화·제어·ESS를 /실행하는 학생 주의할 점 직무명만 보고 선택하지 말고 실제 현장·근무시간·자격·성과압력·고객접점 여부를 채용공고로 확인 9. 관련 전공과 비전공자 진입 • 관련 전공: 전기, 제어, 전자, 메카트로닉스, 에너지 • 비전공자: 가능 여부는 직무별 자격·면허·기술장벽에 따라 다름. 전공을 대신할 프로젝트·도구·자격·인턴 evidence를 확보해야 함. • 추천 전략: 스마트팩토리 분야를 정해 산업지식 + 직무기술을 결합하면 지원서의 구체성이 높아짐. 10. 추천 경험·포트폴리오·자격 • plc·제어설계 관련 수업/팀프로젝트 • 전기설비 설계을 직접 수행한 산학·공모전·개인프로젝트 • 스마트팩토리 기업/기관의 인턴·현장실습·직무체험 • 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 설계·코드·구성도 또는 포트폴리오 • 자격·교육: 기사급 자격(건축·토목·건설안전·설비 등 직무별) / 전기기사·전기공사기사 등 11. 신입 진입도와 현실적 진입경로 신입 진입도 ★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨) 직접 진입 자동화엔지니어, plc, 전기설계 신입·인턴 공고 탐색 경유 진입 j62 전기·전력·발전·송배전, j64 전자·광학·하드웨어, j65 반도체·디스플레이 등 인접 직무에서 경험 후 이동 가능 선발 evidence 전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 star 방식으로 제시 12. 산업 연계 • 주요 진출 산업: 스마트팩토리, 반도체, 배터리, 플랜트, 건물설비 • 같은 직무라도 산업에 따라 제품·고객·법규·기술·kpi가 달라지므로 i66 산업과 결합해 탐색하는 것이 효과적. • 학생 질문 예: ‘자동화·제어·전기설비·ess을 스마트팩토리 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’ 13. 실제 채용검색 키워드·유사직무 • 검색 키워드: 자동화엔지니어, plc, 전기설계, 제어엔지니어, ess, electrical engineer • 유사·인접 직무: j62 전기·전력·발전·송배전, j64 전자·광학·하드웨어, j65 반도체·디스플레이 • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 plc·제어설계·전기설비 설계의 기초업무 수행 • 중기: 독립적으로 자동화 시스템 구축·ess 운영을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 설계·코드/도면 보조, 데이터 분석, 이상탐지, 시뮬레이션·문서화 자동화 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 전공 핵심과 실습환경 구축 • 3개월: git/회로/데이터/인프라 등 직무 프로젝트 • 6개월: 포트폴리오·자격·인턴·오픈소스/캡스톤 • 대표 결과물: 생산라인 센서·plc 로직을 분석해 정지 원인을 제거하고 자동화 사이클타임을 단축 • 6개월 후 목표: 자동화엔지니어 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 논리·분석을 활용하는 일을 비교적 즐긴다. □ 기술학습이 요구되는 문제를 피하지 않는다. □ plc·제어설계 같은 활동에 흥미가 있다. □ plc 등 직무 도구를 배우는 데 거부감이 적다. □ 스마트팩토리 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 생산라인 센서·plc 로직을 분석해 정지 원인을 제거하고 자동화 사이클타임을 단축. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결 접 수행한 산학·공모전·개인프로젝트 • it 기업/기관의 인턴·현장실습·직무체험 • 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 설계·코드·구성도 또는 포트폴리오 • 자격·교육: 정보처리기사(선택), 코딩테스트·프로젝트가 핵심 11. 신입 진입도와 현실적 진입경로 신입 진입도 ★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨) 직접 진입 software engineer, backend, frontend 신입·인턴 공고 탐색 경유 진입 j65 반도체·디스플레이, j67 데이터·ai, j64 전자·광학·하드웨어 등 인접 직무에서 경험 후 이동 가능 선발 evidence 전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 star 방식으로 제시 12. 산업 연계 • 주요 진출 산업: it, 금융, 제조, 게임, 공공 • 같은 직무라도 산업에 따라 제품·고객·법규·기술·kpi가 달라지므로 i66 산업과 결합해 탐색하는 것이 효과적. • 학생 질문 예: ‘sw·정보시스템 개발을 it 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’ 13. 실제 채용검색 키워드·유사직무 • 검색 키워드: software engineer, backend, frontend, app developer, system developer, embedded sw • 유사·인접 직무: j65 반도체·디스플레이, j67 데이터·ai, j64 전자·광학·하드웨어 • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 요구사항 분석·아키텍처·설계의 기초업무 수행 • 중기: 독립적으로 프론트/백엔드 개발·테스트·코드리뷰을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 설계·코드/도면 보조, 데이터 분석, 이상탐지, 시뮬레이션·문서화 자동화 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 전공 핵심과 실습환경 구축 • 3개월: git/회로/데이터/인프라 등 직무 프로젝트 • 6개월: 포트폴리오·자격·인턴·오픈소스/캡스톤 • 대표 결과물: 사용자 로그인 서비스의 api·db를 설계하고 테스트·배포한 뒤 오류율과 응답속도를 개선 • 6개월 후 목표: software engineer 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 논리·분석을 활용하는 일을 비교적 즐긴다. □ 기술학습이 요구되는 문제를 피하지 않는다. □ 요구사항 분석 같은 활동에 흥미가 있다. □ git 등 직무 도구를 배우는 데 거부감이 적다. □ it 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 사용자 로그인 서비스의 api·db를 설계하고 테스트·배포한 뒤 오류율과 응답속도를 개선. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 1332 응용 소프트웨어 개발자, 1331 시스템 소프트웨어 개발자, 1339 기타 컴퓨터 시스템 및 소프트웨어 전문가, 1362 웹 운영자, 1320 컴퓨터시스템 전문가 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한전kdn 2026년 신입사원 차단·복구·재발방지 수행 • 6개월 후 목표: security engineer 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 논리·분석을 활용하는 일을 비교적 즐긴다. □ 기술학습이 요구되는 문제를 피하지 않는다. □ 보안관제 같은 활동에 흥미가 있다. □ siem 등 직무 도구를 배우는 데 거부감이 적다. □ it 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 비정상 로그인과 네트워크 로그를 상관분석해 침해사고 범위를 확인하고 차단·복구·재발방지 수행. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 1312 통신공학 기술자 및 연구원, 1342 정보 보안 전문가, 1361 정보 시스템 운영자 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한전kdn 2026년 신입사원 채용 : https://job.alio.go.kr/recruitview.do?idx=298369 • 현대자동차 2026년 채용(it·data·infra·security 직무 체계) : https://talent.hyundai.com/apply/applylist.hc • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J71","name":"농업·원예·스마트농업","intro":[{"type":"p","text":"작물·원예·스마트농업 생산을 계획하고 생육·환경·품질·시설 데이터를 관리해 생산성과 지속가능성을 높이는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑭ 농림·수산·자원"],["한 줄 정의","작물·원예·스마트농업 생산을 계획하고 생육·환경·품질·시설 데이터를 관리해 생산성과 지속가능성을 높이는 직무"],["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["대표 시장직무명","스마트팜 운영, 재배기술, 농업연구, 품질관리, 원예기술, Agronomist"],["주요 산업","농업법인, 스마트팜, 종자, 공공농업, 식품원료"],["NCS 기반","대표 NCS: 농산물품질관리, 농업환경개선, 농촌체험상품개발, 농촌체험시설운영, 과수재배, 버섯재배, 수도작재배, 시설원예 / 매핑 세분류 19개 / 능력단위 276개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["농업","작물재배","작물재배 관련 자료정리·운영지원·기초분석·현장보조"],["원예","시설원예","시설원예 관련 자료정리·운영지원·기초분석·현장보조"],["스마트농업","스마트팜 운영","스마트팜 운영 관련 자료정리·운영지원·기초분석·현장보조"]]}],"3. 주요 업무":[{"type":"p","text":"• 작물재배","style":"Body Compact"},{"type":"p","text":"• 시설원예","style":"Body Compact"},{"type":"p","text":"• 스마트팜 운영","style":"Body Compact"},{"type":"p","t  17. 자기진단 체크리스트 □ 관찰·분석을 활용하는 일을 비교적 즐긴다. □ 현장대응이 요구되는 문제를 피하지 않는다. □ 작물재배 같은 활동에 흥미가 있다. □ 스마트팜 센서 등 직무 도구를 배우는 데 거부감이 적다. □ 농업법인 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 온도·습도·co2·생육 데이터를 분석해 시설원예의 관수·환기·양액 조건을 최적화. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 9011 곡식작물 재배원, 9051 농업 관련 단순 종사원, 1223 농림어업 관련 시험원, 9013 과수작물 재배원, 9014 원예작물 재배원 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • alio 공공기관 채용정보 : https://job.alio.go.kr/ • 농촌진흥청 : https://www.rda.go.kr/ • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J72","name":"축산·임업·산림","intro":[{"type":"p","text":"가축·산림·임산자원을 생산·보호·관리해 생물자원의 생산성과 산림 생태의 지속가능성을 유지하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑭ 농림·수산·자원"],["한 줄 정의","가축·산림·임산자원을 생산·보호·관리해 생물자원의 생산성과 산림 생태의 지속가능성을 유지하는 직무"],["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["대표 시장직무명","축산관리, 산림경영, 임업기술, 산림보호, 동물생산, Forestry Specialist"],["주요 산업","축산, 산림, 공공기관, 사료, 임산업"],["NCS 기반","대표 NCS: 산림개발, 산림보호, 산림조성, 임업종묘, 임산물생산, 가금사육, 곤충사육, 돼지사육 / 매핑 세분류 17개 / 능력단위 269개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["축산","가축사육·건강관리","가축사육·건강관리 관련 자료정리·운영지원·기초분석·현장보조"],["임업","사료·번식 관리","사료·번식 관리 관련 자료정리·운영지원·기초분석·현장보조"],["산림","산림조성","산림조성 관련 자료정리·운영지원·기초분석·현장보조"]]}],"3. 주요 업무":[{"type":"p","text":"• 가축사육·건강관리","style":"Body Compact"},{"type":"p","text":"• 사료·번식 관리","style":"Body Compact"},{"type":"p","text":"• 산림조성","style":"Body Compact"},{"type":"p","text":"• 산림보호·병해충","style":"Body Compact"},{"type":"p","text":"• 임산물 생산","style":"Body Compact"},{"type":"p","text":"• 산림경영·자원조사","style":"Body Compac "type":"p","text":"• 주요 진출 산업: 양식, 수산업, 해양공공, 사료, 수산식품","style":"Body Compact"},{"type":"p","text":"• 같은 직무라도 산업에 따라 제품·고객·법규·기술·KPI가 달라지므로 I66 산업과 결합해 탐색하는 것이 효과적.","style":"Body Compact"},{"type":"p","text":"• 학생 질문 예: ‘수산·어업·해양생산을 양식 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’","style":"Body Compact"}],"13. 실제 채용검색 키워드·유사직무":[{"type":"p","text":"• 검색 키워드: 양식기술, 수산연구, 스마트양식, 수산질병, 어업관리, Aquaculture Specialist","style":"Body Compact"},{"type":"p","text":"• 유사·인접 직무: J72 축산·임업·산림, J71 농업·원예·스마트농업","style":"Body Compact"},{"type":"p","text":"• 검색 팁: J74 정식명칭 하나만 검색하지 말고 기업별 Alias(영문명·통합직무·사업부 직무명)까지 함께 검색","style":"Body Compact"}],"14. 커리어패스":[{"type":"p","text":"• 초기: Junior/Staff/Assistant 수준에서 양식생산·스마트양식의 기초업무 수행","style":"Body Compact"},{"type":"p","text":"• 중기: 독립적으로 수산질병 관리·어업운영을 책임지는 Specialist/Senior","style":"Body Compact"},{"type":"p","text":"• 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장","style":"Body Compact"}],"15. AI·자동화 영향":[{"type":"table","rows":[["AI가 빠르게 보조할 업무","자료검색·요약, 초안 작성, 반복 문서화, 데이터 전처리·패턴 탐색"],["사람의 핵심역할","문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증"],["대학생 준비 포인트","AI 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명"]]}],"16. 1·3·6개월 준비 Roadmap":[{"type":"p","text":"• 1개월: 생물·생산·환경 기초","style":"Body Compact"},{"type":"p","text":"• 3개월: 스마트팜/산림/양식 데이터 프로젝트","style":"Body Compact"},{"type":"p","text":"• 6개월: 현장실습·기사/산업기사·기관/기업 경험","style":"Body Compact"},{"type":"p","text":"• 대표 결과물: 수온·용존산소·사료량·성장률 데이터를 분석해 스마트양식 급이와 환경제어 기준을 최적화","style":"Body Compact"},{"type":"p","text":"• 6개월 후 목표: 양식기술 지원용 포트폴리오 2~3개 + 직무경험 1개 이상","style":"Body Compact"}],"17. 자기진단 체크리스트":[{"type":"p","text":"□ 관찰·분석을 활용하는 일을 비교적 즐긴다.","style":"Body Compact"},{"type":"p","text":"□ 현장대응이 요구되는 문제를 피하지 않는다.","style":"Body Compact"},{"type":"p","text":"□ 양식생산 같은 활동에 흥미가 있다.","style":"Body Compact"},{"type":"p","text":"□ 수질센서 등 직무 도구를 배우는 데 거부감이 적다.","style":"Body Compact"},{"type":"p","text":"□ 양식 분야의 뉴스·현장·서비스에 관심이 있다.","style":"Body Compact"},{"type":"p","text":"□ 정확한 기록·기한·책임을 지키며 협업할 수 :"Body Compact"}],"6. 주요 산출물과 KPI":[{"type":"table","rows":[["대표 산출물","대표 KPI"],["법률/정책/안전 검토서","법규준수·오류율"],["사건·점검·상황 기록","사건/위험 감소"],["계획·매뉴얼","처리기간"],["공문·보고서","민원·이해관계자 만족"],["대응·개선안","대응·예방 성과"]]}],"7. 필요한 KSA(Knowledge·Skill·Ability)":[{"type":"table","rows":[["Knowledge","법령·규정, 행정·절차, 위험·안전, 윤리·인권, 사건·증거 관리"],["Skill","정책, 예산, 공공행정, 데이터·문서화, 협업·보고"],["Ability","법규해석, 정확성, 판단력, 윤리, 문서작성, 위기대응"],["Tool","HWP/Word, Excel, 전자결재·정부시스템, 통계·BI, 정책DB"]]}],"8. 직무 적합성 프로파일":[{"type":"table","rows":[["가치","공정·안전·공익·책임·규범"],["흥미(Holland)","C 관습형 + S 사회형 + I 탐구형 / R 현실형"],["업무방식","법·규정·절차 준수, 문서 증거와 책임성이 높고 상황에 따라 현장대응 필요"],["잘 맞는 학생","법규해석·정확성을 강점으로 쓰고, 정책·사업 기획 같은 문제를 탐구/실행하는 학생"],["주의할 점","직무명만 보고 선택하지 말고 실제 현장·근무시간·자격·성과압력·고객접점 여부를 채용공고로 확인"]]}],"9. 관련 전공과 비전공자 진입":[{"type":"p","text":"• 관련 전공: 행정, 정책, 경제, 법학, 전공무관+공공역량","style":"Body Compact"},{"type":"p","text":"• 비전공자: 가능 여부는 직무별 자격·면허·기술장벽에 따라 다름. 전공을 대신할 프로젝트·도구·자격·인턴 Evidence를 확보해야 함.","style":"Body Compact"},{"type":"p","text":"• 추천 전략: 정부 분야를 정해 산업지식 + 직무기술을 결합하면 지원서의 구체성이 높아짐.","style":"Body Compact"}],"10. 추천 경험·포트폴리오·자격":[{"type":"p","text":"• 정책·사업 기획 관련 수업/팀프로젝트","style":"Body Compact"},{"type":"p","text":"• 예산·성과관리을 직접 수행한 산학·공모전·개인프로젝트","style":"Body Compact"},{"type":"p","text":"• 정부 기업/기관의 인턴·현장실습·직무체험","style":"Body Compact"},{"type":"p","text":"• 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 법률/정책/안전 검토서 또는 포트폴리오","style":"Body Compact"},{"type":"p","text":"• 자격·교육: 한국사·NCS/PSAT형 문제해결 및 공공기관별 자격 가점 확인","style":"Body Compact"}],"11. 신입 진입도와 현실적 진입경로":[{"type":"table","rows":[["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["직접 진입","행정직, 정책기획, 사업관리 신입·인턴 공고 탐색"],["경유 진입","J35 경비·경호·보안, J34 소방·재난안전, J33 경찰·교정·국방·공공안전 등 인접 직무에서 경험 후 이동 가능"],["선발 Evidence","전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 STAR 방식으로 제시"]]}],"12. 산업 연계":[{"type":"p","text":"• 주요 진출 산업: 정부, 공공기관, 지자체, 출자출연기관, 협회·재단","style":"Body Compact"},{"type":"p","text":"• 같은 직무라도 산업에 따라 제품·고객·법규·기술·KPI가 달라지므로 I66 산업과 결합해 탐색하는 것이 효과적.","style":"Body Compact"},{"type":"p","text":"• 학생 질문 예: ‘공공행정·정책·기관운영을 정부 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’","style":"Body Compact"}],"13. 실제 채용검색 키워드·유사직무":[{"type":"p","text":"• 검색 키워드: 행정직, 정책기획, 사업관리, 공공기관 사무, 정부행정, Policy Analyst","style":"Body Compact"},{"type":"p","text":"• 유사·인접 직무: J35 경비·경호·보안, J34 소방·재난안전, J33 경찰·교정·국방·공공안전","style":"Body Compact"},{"type":"p","text":"• 검색 팁: J74 정식명칭 하나만 검색하지 말고 기업별 Alias(영문명·통합직무·사업부 직무명)까지 함께 검색","style":"Body Compact"}],"14. 커리어패스":[{"type":"p","text":"• 초기: Junior/Staff/Assistant 수준에서 정책·사업 기획·예산·성과관리의 기초업무 수행","style":"Body Compact"},{"type":"p","text":"• 중기: 독립적으로 공공행정·문서·민원·이해관계자 대응을 책임지는 Specialist/Senior","style":"Body Compact"},{"type":"p","text":"• 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장","style":"Body Compact"}],"15. AI·자동화 영향":[{"type":"table","rows":[["AI가 빠르게 보조할 업무","자료검색·요약, 초안 작성, 반복 문서화, 데이터 전처리·패턴 탐색"],["사람의 핵심역할","문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증"],["대학생 준비 포인트","AI 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명"]]}],"16. 1·3·6개월 준비 Roadmap":[{"type":"p","text":"• 1개월: 관련 법령·제도와 채용요건 확인","style":"Body Compact"},{"type":"p","text":"• 3개월: 사례분석·직무기술서 기반 포트폴리오","style":"Body Compact"},{"type":"p","text":"• 6개월: 자격·시험·인턴·공공프로젝트 준비","style":"Body Compact"},{"type":"p","text":"• 대표 결과물: 청년취업지원사업의 대상·예산·성과지표를 설계하고 집행실적과 만족도·취업성과를 평가","style":"Body Compact"},{"type":"p","text":"• 6개월 후 목표: 행정직 지원용 포트폴리오 2~3개 + 직무경험 1개 이상","style":"Body Compact"}],"17. 자기진단 체크리스트":[{"type":"p","text":"□ 법규해석을 활용하는 일을 비교적 즐긴다.","style":"Body Compact"},{"type":"p","text":"□ 정확성이 요구되는 문제를 피하지 않는다.","style":"Body Compact"},{"type":"p","text":"□ 정책·사업 기획 같은 활동에 흥미가 있다.","style":"Body Compact"},{"type":"p","text":"□ HWP/Word 등 직무 도구를 배우는 데 거부감이 적다.","style":"Body Compact"},{"type":"p","text":"□ 정부 분야의 뉴스·현장·서비스에 관심이 있다.","style":"Body Compact"},{"type":"p","text":"□ 정확한 기록·기한·책임을 지키며 협업할 수 있다.","style":"Body Compact"},{"type":"p","text":"판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다.","style":"Small"}],"18. 실무 사례":[{"type":"p","text":" let category='전체', current=null, favOnly=false;
let favorites=new Set(JSON.parse(localStorage.getItem('j74_favs')||'[]'));
let compare=JSON.parse(localStorage.getItem('j74_compare')||'[]');

const $=s=>document.querySelector(s);
const esc=s=>(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const secNo=s=>parseInt((s.match(/^(\d+)\./)||[])[1]||999);

function cats(){
  return [...new Set(JOBS.map(j=>j.meta.category).filter(Boolean))];
}
function renderFilters(){
  const wrap=$('#filters');
  wrap.innerHTML=['전체',...cats()].map(c=>`<button class="chip ${c===category?'active':''}" onclick="setCat(${JSON.stringify(c)})">${esc(c==='전체'?'전체':c)}</button>`).join('');
}
function setCat(c){category=c;renderFilters();renderGrid()}
function normalize(s){return (s||'').toLowerCase().replace(/\s+/g,' ')}

function renderGrid(){
  const q=normalize($('#q').value);
  let rows=JOBS.filter(j=>(category==='전체'||j.meta.category===category) && (!q||j.search.includes(q)) && (!favOnly||favorites.has(j.code)));
  $('#count').textContent=`${rows.length} / 74`;
  $('#empty').hidden=rows.length>0;
  $('#grid').innerHTML=rows.map(j=>`
    <article class="card" onclick="openDetail('${j.code}')">
      <div class="cardtop">
        <div>
          <div class="code">${j.code}</div>
          <h3>${esc(j.name)}</h3>
        </div>
        <button class="star ${favorites.has(j.code)?'on':''}" onclick="event.stopPropagation();toggleFav('${j.code}')" aria-label="즐겨찾기">★</button>
      </div>
      <div class="cat">${esc(j.meta.category)}</div>
      <div class="def">${esc(j.meta.definition)}</div>
      <div class="tags">
        ${j.meta.entry?`<span class="tag">${esc(j.meta.entry.split(' ')[0])}</span>`:''}
        ${j.meta.holland?`<span class="tag">${esc(j.meta.holland.split('+').slice(0,2).join('+').trim())}</span>`:''}
        ${compare.includes(j.code)?'<span class="tag">비교담김</span>':''}
      </div>
    </article>`).join('');
  updateCompareBar();
}

function toggleFav(code){
  favorites.has(code)?favorites.delete(code):favorites.add(code);
  localStorage.setItem('j74_favs',JSON.stringify([...favorites]));
  renderGrid();
}
function toggleCurrentFav(){if(current)toggleFav(current.code)}
function closeDetail(){ $('#drawer').classList.remove('open'); document.body.style.overflow=''; location.hash=''; }

function tableHTML(rows){
  if(!rows?.length)return '';
  return `<div class="tablewrap"><table>${rows.map((r,i)=>`<tr>${r.map(c=>`<td>${linkify(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
function linkify(text){
  let s=esc(text||'');
  return s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function sectionHTML(sec,items,code){
  let body='';
  const isCheck=sec.startsWith('17.');
  if(isCheck){
    const checks=items.filter(x=>x.type==='p' && /^[□☐]/.test(x.text));
    const others=items.filter(x=>!(x.type==='p' && /^[□☐]/.test(x.text)));
    body+=checks.map((x,i)=>`<label class="checkitem"><input type="checkbox" onchange="scoreChecks('${code}')"><span>${esc(x.text.replace(/^[□☐]\s*/,''))}</span></label>`).join('');
    body+=`<div id="score-${code}" class="scorebox">선택 0 / ${checks.length}</div>`;
    for(const it of others) body+=it.type==='table'?tableHTML(it.rows):`<p class="${it.text.startsWith('•')?'bullet':''}">${linkify(it.text)}</p>`;
  } else {
    for(const it of items) body+=it.type==='table'?tableHTML(it.rows):`<p class="${it.text.startsWith('•')?'bullet':''}">${linkify(it.text)}</p>`;
  }
  return `<section class="accordion ${secNo(sec)<=2?'open':''}">
    <button class="accbtn" onclick="this.parentElement.classList.toggle('open')"><span>${esc(sec)}</span><span class="chev">⌄</span></button>
    <div class="accbody">${body}</div>
  </section>`;
}
function scoreChecks(code){
  const box=$(`#score-${code}`); if(!box)return;
  const section=box.closest('.accbody');
  const all=section.querySelectorAll('input[type=checkbox]');
  const n=[...all].filter(x=>x.checked).length;
  let msg=n>=4?'우선 탐색직무로 검토해 볼 수 있습니다.':'관심·경험을 더 확인해 보세요.';
  box.textContent=`선택 ${n} / ${all.length} · ${msg}`;
}
function qbox(label,val){ return val?`<div class="q"><b>${esc(label)}</b><div>${esc(val)}</div></div>`:'' }

function openDetail(code){
  current=JOBS.find(j=>j.code===code); if(!current)return;
  const j=current;
  let html=`<div class="lead"><small>${esc(j.code)} · ${esc(j.meta.category)}</small><div class="title">${esc(j.name)}</div><p>${esc(j.meta.definition)}</p></div>`;
  html+=`<div class="quick">
    ${qbox('신입 진입도',j.meta.entry)}${qbox('대표 시장직무명',j.meta.aliases)}
    ${qbox('주요 산업',j.meta.industries)}${qbox('Holland',j.meta.holland)}
    ${qbox('핵심 Ability',j.meta.ability)}${qbox('Tool',j.meta.tool)}
  </div>`;
  for(const [sec,items] of Object.entries(j.sections)) html+=sectionHTML(sec,items,j.code);
  html+=`<p class="notice">※ 신입 진입도와 자기진단은 진로탐색용 상대평가입니다. 실제 채용요건은 해당 연도 공고와 법령을 최종 확인하세요.</p>`;
  $('#detail').innerHTML=html;
  $('#drawer').classList.add('open'); document.body.style.overflow='hidden';
  location.hash=code;
}
function toggleCompare(code){
  if(compare.includes(code)) compare=compare.filter(x=>x!==code);
  else {
    if(compare.length>=3){ alert('비교는 최대 3개 직무까지 가능합니다.'); return; }
    compare.push(code);
  }
  localStorage.setItem('j74_compare',JSON.stringify(compare));
  renderGrid();
}
function toggleCurrentCompare(){ if(current)toggleCompare(current.code) }
function clearCompare(){compare=[];localStorage.setItem('j74_compare','[]');renderGrid()}
function updateCompareBar(){
  const bar=$('#comparebar');
  if(!compare.length){bar.classList.remove('show');return}
  bar.classList.add('show');
  $('#compareNames').textContent=compare.map(c=>{const j=JOBS.find(x=>x.code===c);return j?`${j.code} ${j.name}`:c}).join(' · ');
}
function openCompare(){
  const js=compare.map(c=>JOBS.find(j=>j.code===c)).filter(Boolean);
  if(js.length<2){alert('2개 이상의 직무를 비교함에 담아 주세요.');return}
  const rows=[
    ['상위직군','category'],['한 줄 정의','definition'],['신입 진입도','entry'],['대표 시장직무명','aliases'],
    ['주요 산업','industries'],['가치','value'],['Holland','holland'],['업무방식','workstyle'],
    ['Knowledge','knowledge'],['Skill','skill'],['Ability','ability'],['Tool','tool'],
    ['직접 진입','direct'],['경유 진입','bridge'],['AI 보조 업무','aiassist'],['사람의 핵심역할','human']
  ];
  let h=`<div class="tablewrap"><table class="comparetable"><tr><th>항목</th>${js.map(j=>`<th>${esc(j.code)} ${esc(j.name)}</th>`).join('')}</tr>`;
  h+=rows.map(([label,key])=>`<tr><th>${label}</th>${js.map(j=>`<td>${esc(j.meta[key]||'-')}</td>`).join('')}</tr>`).join('');
  h+='</table></div>';
  $('#compareContent').innerHTML=h; $('#compareModal').classList.add('open');
}
function closeCompare(){ $('#compareModal').classList.remove('open') }

$('#q').addEventListener('input',renderGrid);
$('#favOnly').addEventListener('click',e=>{favOnly=!favOnly;e.currentTarget.classList.toggle('favOnlyOn',favOnly);renderGrid()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDetail();closeCompare()}});
renderFilters(); renderGrid();
if(/^#J\d{2}$/.test(location.hash)){openDetail(location.hash.slice(1))}
</script>
</body>
</html>
