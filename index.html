
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2f56">
<title>J74 직무사전 | Interactive</title>
<style>
:root{
  --navy:#0b2f56; --blue:#155ea8; --sky:#eaf4ff; --ink:#142033; --muted:#64748b;
  --line:#dbe5ef; --bg:#f5f8fb; --card:#fff; --green:#2f7d32; --amber:#a95f00;
  --radius:18px; --shadow:0 8px 28px rgba(15,45,75,.08);
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;line-height:1.58}
button,input,select{font:inherit}
a{color:var(--blue);text-decoration:none}
.shell{max-width:1180px;margin:auto;padding:0 18px 90px}
.hero{background:linear-gradient(135deg,#082947,#124f87 65%,#1976b9);color:white;padding:34px 0 28px;margin-bottom:18px}
.hero .inner{max-width:1180px;margin:auto;padding:0 18px}
.kicker{font-size:12px;letter-spacing:.14em;font-weight:800;opacity:.8}
h1{font-size:clamp(28px,5vw,46px);line-height:1.08;margin:8px 0 10px}
.hero p{margin:0;max-width:760px;color:#dcecff}
.heroStats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.12);font-size:13px}
.toolbar{position:sticky;top:0;z-index:20;background:rgba(245,248,251,.94);backdrop-filter:blur(12px);padding:10px 0 8px}
.searchrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:white;outline:none}
.search:focus{border-color:#78aee0;box-shadow:0 0 0 3px #dbeeff}
.iconbtn,.btn{border:0;border-radius:12px;padding:11px 13px;background:white;color:var(--ink);box-shadow:0 0 0 1px var(--line) inset;cursor:pointer;font-weight:700}
.btn.primary{background:var(--navy);color:white;box-shadow:none}
.filters{display:flex;gap:7px;overflow:auto;padding:9px 1px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;cursor:pointer;font-size:12px;white-space:nowrap}
.chip.active{background:var(--navy);color:white;border-color:var(--navy)}
.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 10px}
.summary h2{font-size:18px;margin:0}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);cursor:pointer;transition:.18s}
.card:hover{transform:translateY(-2px);border-color:#a8c7e4}
.cardtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.code{font-size:12px;font-weight:900;color:var(--blue);letter-spacing:.06em}
.card h3{font-size:18px;line-height:1.3;margin:4px 0 7px}
.cat{font-size:12px;color:#52667a;margin-bottom:8px}
.def{font-size:14px;color:#334155;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef4f9;color:#415a70}
.star{border:0;background:transparent;font-size:21px;cursor:pointer;color:#94a3b8}.star.on{color:#f59e0b}
.empty{padding:50px 15px;text-align:center;color:var(--muted)}
.drawer{position:fixed;inset:0;z-index:50;display:none}
.drawer.open{display:block}.backdrop{position:absolute;inset:0;background:rgba(3,12,24,.54)}
.panel{position:absolute;right:0;top:0;height:100%;width:min(760px,100%);background:var(--bg);overflow:auto;padding-bottom:30px}
.panelhead{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);padding:15px 18px;border-bottom:1px solid var(--line)}
.panelheadrow{display:flex;gap:10px;align-items:flex-start}
.close{margin-left:auto}
.detail{padding:18px}
.title{font-size:28px;line-height:1.18;margin:3px 0 7px}
.lead{background:linear-gradient(135deg,#0c3158,#185f9e);color:white;padding:18px;border-radius:18px;margin-bottom:14px}
.lead small{opacity:.75}.lead p{margin:8px 0 0;font-size:16px}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0 18px}
.q{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.q b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.accordion{background:white;border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
.accbtn{width:100%;text-align:left;border:0;background:white;padding:15px 16px;font-weight:850;display:flex;justify-content:space-between;gap:12px;cursor:pointer;color:var(--ink)}
.accbody{display:none;padding:0 16px 16px}.accordion.open .accbody{display:block}.accordion.open .chev{transform:rotate(180deg)}
.chev{transition:.2s}
.accbody p{margin:7px 0}.bullet{padding-left:1.15em;text-indent:-.9em}
.tablewrap{overflow:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{border:1px solid #cfdbe7;padding:8px 9px;vertical-align:top;text-align:left}
tr:first-child td{background:#eef5fb;font-weight:800}
.checkitem{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #e2e8f0}
.checkitem input{margin-top:5px;transform:scale(1.2)}
.scorebox{margin-top:12px;background:#f0f7ff;padding:12px;border-radius:12px;font-weight:800}
.comparebar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:35;display:none;width:min(720px,calc(100% - 24px));background:#0b2f56;color:white;border-radius:16px;padding:10px 12px;box-shadow:0 15px 35px rgba(0,0,0,.25)}
.comparebar.show{display:flex;align-items:center;gap:8px}
.comparebar .names{flex:1;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.comparebar button{border:0;border-radius:10px;padding:8px 10px;cursor:pointer}
.modal{position:fixed;inset:0;z-index:60;background:rgba(3,12,24,.6);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}.modalbox{width:min(1000px,100%);max-height:92vh;overflow:auto;background:white;border-radius:22px 22px 0 0;padding:18px}
.comparetable{min-width:760px}.comparetable th:first-child{position:sticky;left:0;background:#f8fafc;z-index:1}
.favOnlyOn{background:#fff7df!important;border-color:#efbd42!important}
.notice{font-size:12px;color:var(--muted);margin:10px 0 0}
.footer{padding:38px 0 10px;text-align:center;color:var(--muted);font-size:12px}
mark{background:#fff2a8;padding:0 1px}
@media(max-width:760px){
  .shell{padding:0 12px 92px}.hero .inner{padding:0 14px}.hero{padding:27px 0 23px}
  .grid{grid-template-columns:1fr}.toolbar{margin:0 -12px;padding:9px 12px 7px}
  .card{padding:15px}.quick{grid-template-columns:1fr}.title{font-size:24px}.detail{padding:14px}
  .panelhead{padding:12px 14px}.modalbox{padding:14px}.heroStats{gap:7px}.stat{font-size:11px}
}
@media(min-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media print{
 .hero,.toolbar,.comparebar,.panelhead,.modal,.star{display:none!important}
 body{background:white}.panel{position:static;width:100%;height:auto}.drawer.open{display:block;position:static}.backdrop{display:none}
 .accordion .accbody{display:block!important}.accordion{break-inside:avoid}
}
</style>
</head>
<body>
<header class="hero">
  <div class="inner">
    <div class="kicker">J74 JOB CLASSIFICATION</div>
    <h1>J74 직무사전</h1>
    <p>대학생의 직무 이해 · 적합성 판단 · 취업준비를 위한 직무사전</p>
    <div class="heroStats">
      <span class="stat">74개 직무</span><span class="stat">14대 상위직군</span>
      <span class="stat">KSA · Fit · AI 영향</span><span class="stat">1·3·6개월 Roadmap</span>
    </div>
  </div>
</header>

<main class="shell">
  <div class="toolbar">
    <div class="searchrow">
      <input id="q" class="search" placeholder="직무명·전공·산업·역량·Tool 검색" autocomplete="off">
      <button id="favOnly" class="iconbtn" title="즐겨찾기만 보기">★</button>
    </div>
    <div id="filters" class="filters"></div>
  </div>

  <div class="summary">
    <h2>직무 탐색</h2>
    <div id="count" class="muted"></div>
  </div>
  <section id="grid" class="grid"></section>
  <div id="empty" class="empty" hidden>검색 조건에 맞는 직무가 없습니다.</div>
  <div class="footer">J74 정밀 통합본 v1.0 · 기준일 2026.09.09 · 오프라인 실행 가능</div>
</main>

<div id="drawer" class="drawer">
  <div class="backdrop" onclick="closeDetail()"></div>
  <article class="panel">
    <div class="panelhead">
      <div class="panelheadrow">
        <button class="btn" onclick="toggleCurrentFav()">★ 즐겨찾기</button>
        <button class="btn" onclick="toggleCurrentCompare()">⇄ 비교담기</button>
        <button class="btn" onclick="window.print()">인쇄/PDF</button>
        <button class="btn close" onclick="closeDetail()">닫기</button>
      </div>
    </div>
    <div id="detail" class="detail"></div>
  </article>
</div>

<div id="comparebar" class="comparebar">
  <div id="compareNames" class="names"></div>
  <button onclick="openCompare()">비교하기</button>
  <button onclick="clearCompare()">초기화</button>
</div>

<div id="compareModal" class="modal" onclick="if(event.target===this) closeCompare()">
  <div class="modalbox">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <h2 style="margin:0">직무 비교</h2>
      <button class="btn" onclick="closeCompare()">닫기</button>
    </div>
    <div id="compareContent" style="margin-top:12px"></div>
  </div>
</div>

긴다. □ 조정력이 요구되는 문제를 피하지 않는다. □ 문서·회의·일정 관리 같은 활동에 흥미가 있다. □ excel 등 직무 도구를 배우는 데 거부감이 적다. □ 전 산업 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 사무공간·비품·계약 현황을 표준화해 구매 리드타임과 운영비를 줄이는 개선안 작성. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 0265 총무 사무원 및 대학 행정조교, 0259 기타 정부 행정 사무원, 0284 자재관리 사무원, 0294 비서, 0299 기타 사무 지원 종사원 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 현대자동차 2026년 채용 직무 체계(hr·비즈니스지원 등) : https://talent.hyundai.com/apply/applylist.hc • 롯데백화점 2026년 9월 신입 채용(인사·총무 등 영업점 지원업무) : https://recruit.lotte.co.kr/apply/announcement/detail/21930487?compcd=40001 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J06","name":"기업재무·회계·세무","intro":[{"type":"p","text":"기업의 돈의 흐름과 거래를 기록·분석하고 자금·예산·세금·결산을 관리해 재무 건전성과 의사결정을 지원하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","③ 재무·회계·금융·보험"],["한 줄 정의","기업의 돈의 흐름과 거래를 기록·분석하고 자금·예산·세금·결산을 관리해 재무 건전성과 의사결정을 지원하는 직무"],["신입 진입도","★★★★★ 양호(신입·현장형 진입기회가 비교적 넓음)"],["대표 시장직무명","재무, 회계, 세무, 자금, 원가회계, 재경"],["주요 산업","전 산업, 회계법인, 금융, 공공기관, 스타트업"],["NCS 기반","대표 NCS: 예산, 자금, 회계·감사, 세무 / 매핑 세분류 4개 / 능력단위 34개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["기업재무","회계전표·결산","회계전표·결산 관련 자료정리·운영지원·기초분석·현장보조"],["회계","예산편성·관리","예산편성·관리 관련 자료정리·운영지원·기초분석·현장보조"],["세무","자금계획·출납","자금계획·출납 관련 자료정리·운영지원·기초분석·현장보조"]]}],"3. 주요 업무":[{"type":"p","text":"• 회계전표·결산","style":"Body Compact"},{"type":"p","text":"• 예산편성·관리","style":"Body Compact"},{"type":"p","text":"• 자금계획·출납","style":"Body Compact"},{"type":"p","text":"• 세무신고·세무조정 지원","style":"Body Compact"},{"type":"p","text":"• 재무제표·원가 분석","style el 등 직무 도구를 배우는 데 거부감이 적다. □ 전 산업 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 월 결산 데이터를 바탕으로 비용 증가 원인을 분석하고 다음 분기 예산 조정안을 제시. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 0271 회계 사무원, 0232 세무사 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 현대자동차 2026년 9월 신입 채용(재경) : https://talent.hyundai.com/apply/applylist.hc • 중소벤처기업진흥공단 2026년 하반기 일반직 채용(금융·보험 포함) : https://job.alio.go.kr/recruitview.do?idx=304230 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J07","name":"은행·증권·투자·자산운용","intro":[{"type":"p","text":"고객과 기업의 자금을 예금·대출·투자·자산운용 상품으로 연결하고 시장·기업·포트폴리오를 분석하는 금융 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","③ 재무·회계·금융·보험"],["한 줄 정의","고객과 기업의 자금을 예금·대출·투자·자산운용 상품으로 연결하고 시장·기업·포트폴리오를 분석하는 금융 직무"],["신입 진입도","★★★☆☆ 보통~다소 어려움(직무증거·전문성 중요)"],["대표 시장직무명","은행원, PB, 애널리스트, 펀드운용, 기업금융, Investment Analyst"],["주요 산업","은행, 증권, 자산운용, 핀테크, 공공금융"],["NCS 기반","대표 NCS: 창구사무, 기업영업, PB영업, 여수신상품개발, 투자상품개발, 연금상품개발, 펀드운용, 주식·채권운용 / 매핑 세분류 22개 / 능력단위 247개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["은행","고객 자산상담·상품제안","고객 자산상담·상품제안 관련 자료정리·운영지원·기초분석·현장보조"],["증권","기업·산업 신용분석","기업·산업 신용분석 관련 자료정리·운영지원·기초분석·현장보조"],["투자","증권·펀드·채권 분석","증권·펀드·채권 분석 관련 자료정리·운영지원·기초분석·현장보조"],["자산운용","포트폴리오 운용 지원","포트폴리오 운용 지원 관련 자료정리·운영지원·기초분석·현장보조"]]}],"3. 주요 업무":[{"type":"p","text":"• 고객 자산상담·상품제안","style":"Body Compact"},{"type":"p","text":"• 기업·산업 신용분석","style":"Body Compact"},{"type":"p","text":"• 증권·펀드·채권 분석","style":"Body Compact"},{"type":"p","text":"• 포트폴리오 운용 지원","style":"Body Compact"},{"type":"p","text":"• 금융상품 기획","style":"Body Comp 접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 자료검색·요약, 초안 작성, 반복 문서화, 데이터 전처리·패턴 탐색 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 회계·재무·금융 기본기와 excel • 3개월: 재무제표/상품/기업분석 포트폴리오 • 6개월: 자격·인턴·모의투자/신용분석 등 직무증거 강화 • 대표 결과물: 기업의 재무제표·산업전망·현금흐름을 분석해 대출 또는 투자 의견을 제시 • 6개월 후 목표: 은행원 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 수리·분석력을 활용하는 일을 비교적 즐긴다. □ 정확성이 요구되는 문제를 피하지 않는다. □ 고객 자산상담·상품제안 같은 활동에 흥미가 있다. □ excel 등 직무 도구를 배우는 데 거부감이 적다. □ 은행 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 기업의 재무제표·산업전망·현금흐름을 분석해 대출 또는 투자 의견을 제시. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 0312 자산 운용가, 0322 증권 사무원, 0311 투자 및 신용 분석가, 0321 은행 사무원, 0313 금융 및 보험 상품 개발자 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 현대자동차 2026년 9월 신입 채용(재경) : https://talent.hyundai.com/apply/applylist.hc • 중소벤처기업진흥공단 2026년 하반기 일반직 채용(금융·보험 포함) : https://job.alio.go.kr/recruitview.do?idx=304230 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J08","name":"보험·여신·금융서비스","intro":[{"type":"p","text":"보험·카드·여신 상품과 고객의 신용·사고·위험을 분석해 인수·심사·보상·리스크를 관리하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","③ 재무·회계·금융·보험"],["한 줄 정의","보험·카드·여신 상품과 고객의 신용·사고·위험을 분석해 인수·심사·보상·리스크를 관리하는 직무"],["신입 진입도","★★★☆☆ 보통~다소 어려움(직무증거·전문성 중요)"],["대표 시장직무명","여신심사, 신용분석, 보험심사, 손해사정, 리스크관리, 카드상품기획"],["주요 산업","보험, 카드, 캐피탈, 은행, 핀테크"],["NCS 기반","대표 NCS: 카드영업, 여신전문금융영업, 카드상품개발, 개인신용분석, 기업신용분석, 여신심사, 채권추심, 리스크관리 / 매핑 세분류 18개 / 능력단위 191개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["보험","신용평가·여신심 t":"• 추천 전략: 보험 분야를 정해 산업지식 + 직무기술을 결합하면 지원서의 구체성이 높아짐.","style":"Body Compact"}],"10. 추천 경험·포트폴리오·자격":[{"type":"p","text":"• 신용평가·여신심사 관련 수업/팀프로젝트","style":"Body Compact"},{"type":"p","text":"• 보험 인수·심사을 직접 수행한 산학·공모전·개인프로젝트","style":"Body Compact"},{"type":"p","text":"• 보험 기업/기관의 인턴·현장실습·직무체험","style":"Body Compact"},{"type":"p","text":"• 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 재무·금융 분석자료 또는 포트폴리오","style":"Body Compact"},{"type":"p","text":"• 자격·교육: 신용분석·보험 관련 자격(직무에 따라 선택)","style":"Body Compact"}],"11. 신입 진입도와 현실적 진입경로":[{"type":"table","rows":[["신입 진입도","★★★☆☆ 보통~다소 어려움(직무증거·전문성 중요)"],["직접 진입","여신심사, 신용분석, 보험심사 신입·인턴 공고 탐색"],["경유 진입","J07 은행·증권·투자·자산운용, J06 기업재무·회계·세무 등 인접 직무에서 경험 후 이동 가능"],["선발 Evidence","전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 STAR 방식으로 제시"]]}],"12. 산업 연계":[{"type":"p","text":"• 주요 진출 산업: 보험, 카드, 캐피탈, 은행, 핀테크","style":"Body Compact"},{"type":"p","text":"• 같은 직무라도 산업에 따라 제품·고객·법규·기술·KPI가 달라지므로 I66 산업과 결합해 탐색하는 것이 효과적.","style":"Body Compact"},{"type":"p","text":"• 학생 질문 예: ‘보험·여신·금융서비스을 보험 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’","style":"Body Compact"}],"13. 실제 채용검색 키워드·유사직무":[{"type":"p","text":"• 검색 키워드: 여신심사, 신용분석, 보험심사, 손해사정, 리스크관리, 카드상품기획","style":"Body Compact"},{"type":"p","text":"• 유사·인접 직무: J07 은행·증권·투자·자산운용, J06 기업재무·회계·세무","style":"Body Compact"},{"type":"p","text":"• 검색 팁: J74 정식명칭 하나만 검색하지 말고 기업별 Alias(영문명·통합직무·사업부 직무명)까지 함께 검색","style":"Body Compact"}],"14. 커리어패스":[{"type":"p","text":"• 초기: Junior/Staff/Assistant 수준에서 신용평가·여신심사·보험 인수·심사의 기초업무 수행","style":"Body Compact"},{"type":"p","text":"• 중기: 독립적으로 상품기획·보상·손해사정 지원을 책임지는 Specialist/Senior","style":"Body Compact"},{"type":"p","text":"• 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장","style":"Body Compact"}],"15. AI·자동화 영향":[{"type":"table","rows":[["AI가 빠르게 보조할 업무","자료검색·요약, 초안 작성, 반복 문서화, 데이터 전처리·패턴 탐색"],["사람의 핵심역할","문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증"],["대학생 준비 포인트","AI 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명"]]}],"16. 1·3·6개월 준비 Roadmap":[{"type":"p","text":"• 1개월: 회계·재무·금융 기본기와 Excel 리어패스 • 초기: junior/staff/assistant 수준에서 신용평가·여신심사·보험 인수·심사의 기초업무 수행 • 중기: 독립적으로 상품기획·보상·손해사정 지원을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 자료검색·요약, 초안 작성, 반복 문서화, 데이터 전처리·패턴 탐색 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 회계·재무·금융 기본기와 excel • 3개월: 재무제표/상품/기업분석 포트폴리오 • 6개월: 자격·인턴·모의투자/신용분석 등 직무증거 강화 • 대표 결과물: 고객 신용데이터와 상환이력을 분석해 대출 승인·한도·금리의 위험 기준을 제안 • 6개월 후 목표: 여신심사 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 수리·분석력을 활용하는 일을 비교적 즐긴다. □ 정확성이 요구되는 문제를 피하지 않는다. □ 신용평가·여신심사 같은 활동에 흥미가 있다. □ excel 등 직무 도구를 배우는 데 거부감이 적다. □ 보험 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 고객 신용데이터와 상환이력을 분석해 대출 승인·한도·금리의 위험 기준을 제안. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 0319 기타 금융 및 보험 관련 전문가, 0325 수금원 및 신용 추심원, 0315 손해 사정사, 0331 대출 및 신용카드 모집인, 0313 금융 및 보험 상품 개발자 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 현대자동차 2026년 9월 신입 채용(재경) : https://talent.hyundai.com/apply/applylist.hc • 중소벤처기업진흥공단 2026년 하반기 일반직 채용(금융·보험 포함) : https://job.alio.go.kr/recruitview.do?idx=304230 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J09","name":"마케팅·광고·홍보","intro":[{"type":"p","text":"시장과 고객을 분석해 브랜드·제품의 가치를 알리고 광고·콘텐츠·PR·캠페인으로 수요와 관계를 만드는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","④ 영업·마케팅·유통·무역·고객"],["한 줄 정의","시장과 고객을 분석해 브랜드·제품의 가치를 알리고 광고·콘텐츠·PR·캠페인으로 수요와 관계를 만드는 직무"],["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["대표 시장직무명","마케팅, 브랜드마케팅, 퍼포먼스마케팅, PR, 광고기획, Growth Marketing"],["주요 산업","소비재, 플랫폼, 금융, 제조, 콘텐츠"], type":"p","text":"• 관련 전공: 경영·마케팅, 광고홍보, 미디어, 통계·데이터, 디자인·콘텐츠","style":"Body Compact"},{"type":"p","text":"• 비전공자: 가능 여부는 직무별 자격·면허·기술장벽에 따라 다름. 전공을 대신할 프로젝트·도구·자격·인턴 Evidence를 확보해야 함.","style":"Body Compact"},{"type":"p","text":"• 추천 전략: 소비재 분야를 정해 산업지식 + 직무기술을 결합하면 지원서의 구체성이 높아짐.","style":"Body Compact"}],"10. 추천 경험·포트폴리오·자격":[{"type":"p","text":"• 시장·고객조사 관련 수업/팀프로젝트","style":"Body Compact"},{"type":"p","text":"• 마케팅전략·캠페인 기획을 직접 수행한 산학·공모전·개인프로젝트","style":"Body Compact"},{"type":"p","text":"• 소비재 기업/기관의 인턴·현장실습·직무체험","style":"Body Compact"},{"type":"p","text":"• 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 시장·고객분석 또는 포트폴리오","style":"Body Compact"},{"type":"p","text":"• 자격·교육: 직무 관련 교육·프로젝트 우선, 자격은 채용공고 우대요건 확인","style":"Body Compact"}],"11. 신입 진입도와 현실적 진입경로":[{"type":"table","rows":[["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["직접 진입","마케팅, 브랜드마케팅, 퍼포먼스마케팅 신입·인턴 공고 탐색"],["경유 진입","J10 상품·MD·유통, J11 영업·무역·판매, J12 고객관리·CRM·CS 등 인접 직무에서 경험 후 이동 가능"],["선발 Evidence","전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 STAR 방식으로 제시"]]}],"12. 산업 연계":[{"type":"p","text":"• 주요 진출 산업: 소비재, 플랫폼, 금융, 제조, 콘텐츠","style":"Body Compact"},{"type":"p","text":"• 같은 직무라도 산업에 따라 제품·고객·법규·기술·KPI가 달라지므로 I66 산업과 결합해 탐색하는 것이 효과적.","style":"Body Compact"},{"type":"p","text":"• 학생 질문 예: ‘마케팅·광고·홍보을 소비재 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’","style":"Body Compact"}],"13. 실제 채용검색 키워드·유사직무":[{"type":"p","text":"• 검색 키워드: 마케팅, 브랜드마케팅, 퍼포먼스마케팅, PR, 광고기획, Growth Marketing","style":"Body Compact"},{"type":"p","text":"• 유사·인접 직무: J10 상품·MD·유통, J11 영업·무역·판매, J12 고객관리·CRM·CS","style":"Body Compact"},{"type":"p","text":"• 검색 팁: J74 정식명칭 하나만 검색하지 말고 기업별 Alias(영문명·통합직무·사업부 직무명)까지 함께 검색","style":"Body Compact"}],"14. 커리어패스":[{"type":"p","text":"• 초기: Junior/Staff/Assistant 수준에서 시장·고객조사·마케팅전략·캠페인 기획의 기초업무 수행","style":"Body Compact"},{"type":"p","text":"• 중기: 독립적으로 브랜드·콘텐츠 운영·광고매체·성과관리을 책임지는 Specialist/Senior","style":"Body Compact"},{"type":"p","text":"• 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장","style":"Body Compact"}],"15. AI·자동화 영향":[ 10. 추천 경험·포트폴리오·자격 • 상품기획·소싱 관련 수업/팀프로젝트 • 가격·매출·마진 관리을 직접 수행한 산학·공모전·개인프로젝트 • 백화점 기업/기관의 인턴·현장실습·직무체험 • 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 시장·고객분석 또는 포트폴리오 • 자격·교육: 직무 관련 교육·프로젝트 우선, 자격은 채용공고 우대요건 확인 11. 신입 진입도와 현실적 진입경로 신입 진입도 ★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨) 직접 진입 md, 상품기획, 바이어 신입·인턴 공고 탐색 경유 진입 j09 마케팅·광고·홍보, j11 영업·무역·판매, j12 고객관리·crm·cs 등 인접 직무에서 경험 후 이동 가능 선발 evidence 전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 star 방식으로 제시 12. 산업 연계 • 주요 진출 산업: 백화점, 마트, 홈쇼핑, 이커머스, 패션·식품 • 같은 직무라도 산업에 따라 제품·고객·법규·기술·kpi가 달라지므로 i66 산업과 결합해 탐색하는 것이 효과적. • 학생 질문 예: ‘상품·md·유통을 백화점 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’ 13. 실제 채용검색 키워드·유사직무 • 검색 키워드: md, 상품기획, 바이어, e-commerce md, 유통관리, merchandiser • 유사·인접 직무: j09 마케팅·광고·홍보, j11 영업·무역·판매, j12 고객관리·crm·cs • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 상품기획·소싱·가격·매출·마진 관리의 기초업무 수행 • 중기: 독립적으로 협력사 발굴·협상·프로모션 기획을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 자료검색·요약, 초안 작성, 반복 문서화, 데이터 전처리·패턴 탐색 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 시장·고객·채널 분석 • 3개월: 캠페인/영업/상품/crm 포트폴리오 • 6개월: 인턴·공모전·실제 판매/운영 성과 확보 • 대표 결과물: 판매데이터와 트렌드를 분석해 pb 상품을 기획하고 원가·판매가·프로모션·재고 목표를 설정 • 6개월 후 목표: md 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 고객이해을 활용하는 일을 비교적 즐긴다. □ 커뮤니케이션이 요구되는 문제를 피하지 않는다. □ 상품기획·소싱 같은 활동에 흥미가 있다. □ excel 등 직무 도구를 배우는 데 거부감이 적다. □ 백화점 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 판매데이터와 트렌드를 분석해 pb 상품을 기획하고 원가·판매가·프로모션·재고 목표를 설정. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 0243 상품 기획 전문가, 6154 온라인 쇼핑 판매원 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 롯데백화점 2026년 9월 신입 채용(영업/md·crm·마케팅) : https://recruit.lotte.co.kr/apply/announceme ":"table","rows":[["대표 산출물","대표 KPI"],["시장·고객분석","매출·마진"],["캠페인/영업/상품 계획","전환·재구매·유지율"],["매출·CRM 대시보드","고객만족/NPS"],["제안·계약·프로모션 자료","캠페인 ROAS/성과"],["성과분석 보고서","수주·재고·채널 효율"]]}],"7. 필요한 KSA(Knowledge·Skill·Ability)":[{"type":"table","rows":[["Knowledge","마케팅·소비자, 영업·협상, 유통·채널, 데이터 분석, 상품·무역"],["Skill","잠재고객 발굴, 제안, 계약, 데이터·문서화, 협업·보고"],["Ability","고객이해, 커뮤니케이션, 분석력, 기획력, 협상력, 실행력"],["Tool","CRM, Excel, ERP, 무역시스템, 화상회의/AI 번역"]]}],"8. 직무 적합성 프로파일":[{"type":"table","rows":[["가치","성과·고객가치·창의·관계·성장"],["흥미(Holland)","E 기업형 + S 사회형 + A 예술형 / I 탐구형"],["업무방식","고객·시장 중심, 목표·성과 압력이 존재하며 협업과 빠른 실행이 중요"],["잘 맞는 학생","고객이해·커뮤니케이션을 강점으로 쓰고, 잠재고객 발굴 같은 문제를 탐구/실행하는 학생"],["주의할 점","직무명만 보고 선택하지 말고 실제 현장·근무시간·자격·성과압력·고객접점 여부를 채용공고로 확인"]]}],"9. 관련 전공과 비전공자 진입":[{"type":"p","text":"• 관련 전공: 경영, 무역, 국제통상, 외국어, 산업별 전공","style":"Body Compact"},{"type":"p","text":"• 비전공자: 가능 여부는 직무별 자격·면허·기술장벽에 따라 다름. 전공을 대신할 프로젝트·도구·자격·인턴 Evidence를 확보해야 함.","style":"Body Compact"},{"type":"p","text":"• 추천 전략: 전 산업 분야를 정해 산업지식 + 직무기술을 결합하면 지원서의 구체성이 높아짐.","style":"Body Compact"}],"10. 추천 경험·포트폴리오·자격":[{"type":"p","text":"• 잠재고객 발굴 관련 수업/팀프로젝트","style":"Body Compact"},{"type":"p","text":"• 제안·상담·견적을 직접 수행한 산학·공모전·개인프로젝트","style":"Body Compact"},{"type":"p","text":"• 전 산업 기업/기관의 인턴·현장실습·직무체험","style":"Body Compact"},{"type":"p","text":"• 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 시장·고객분석 또는 포트폴리오","style":"Body Compact"},{"type":"p","text":"• 자격·교육: 직무 관련 교육·프로젝트 우선, 자격은 채용공고 우대요건 확인","style":"Body Compact"}],"11. 신입 진입도와 현실적 진입경로":[{"type":"table","rows":[["신입 진입도","★★★★★ 양호(신입·현장형 진입기회가 비교적 넓음)"],["직접 진입","B2B영업, 해외영업, 기술영업 신입·인턴 공고 탐색"],["경유 진입","J10 상품·MD·유통, J12 고객관리·CRM·CS, J09 마케팅·광고·홍보 등 인접 직무에서 경험 후 이동 가능"],["선발 Evidence","전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 STAR 방식으로 제시"]]}],"12. 산업 연계":[{"type":"p","text":"• 주요 진출 산업: 전 산업, 제조, IT, 무역상사, 서비스","style":"Body Compact"},{"type":"p","text":"• 같은 직무라도 산업에 따라 제품·고객·법규·기술·KPI가 달라지므로 I66 산업과 결합해 탐색하는 것이 효과적.","style":"Body Compact"},{"type":"p","text":"• 학생 질문 예: ‘영업·무역 의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 이론·윤리·대상 이해 • 3개월: 프로그램/연구/상담 사례 포트폴리오 • 6개월: 실습·자격·현장경험 확보 • 대표 결과물: 대학생 ai 취업교육의 학습목표·차시·실습·평가루브릭을 설계하고 수료·성과지표를 관리 • 6개월 후 목표: 교육기획 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 공감·경청을 활용하는 일을 비교적 즐긴다. □ 진단·분석이 요구되는 문제를 피하지 않는다. □ 교육요구 분석 같은 활동에 흥미가 있다. □ lms 등 직무 도구를 배우는 데 거부감이 적다. □ 대학 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 대학생 ai 취업교육의 학습목표·차시·실습·평가루브릭을 설계하고 수료·성과지표를 관리. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 0264 교육 및 훈련 사무원 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한국과학창의재단 2026년 직원 채용 : https://job.alio.go.kr/recruitview.do?idx=298384 • 한국청소년상담복지개발원 2026년 사이버상담원 채용 : https://job.alio.go.kr/recruitview.do?idx=301055 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J14","name":"자연·사회과학 연구·조사","intro":[{"type":"p","text":"자연·사회현상을 연구질문과 자료로 구조화하고 조사·통계·실험을 통해 근거를 생산하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑤ 교육·연구·상담·복지"],["한 줄 정의","자연·사회현상을 연구질문과 자료로 구조화하고 조사·통계·실험을 통해 근거를 생산하는 직무"],["신입 진입도","★★★☆☆ 보통~다소 어려움(직무증거·전문성 중요)"],["대표 시장직무명","연구원, 조사연구원, 리서처, 정책연구원, 시장조사, Research Analyst"],["주요 산업","연구기관, 대학, 공공기관, 컨설팅, 시장조사"],["NCS 기반","대표 NCS: 통계조사 / 매핑 세분류 1개 / 능력단위 12개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["자연","연구문제·가설 설정","연구문제·가설 설정 관련 자료정리·운영지원·기초분석·현장보조"],["사회과학 연구","문헌조사","문헌조사 관련 자료정리·운영지원·기초분석·현장보조"],["조사","조사·실험 설계","조사·실험 설계 관련 자료정리·운영지원·기초분석·현장보조"]]}],"3. 주요 업무":[{"type":"p","text":"• 연구문제·가설 설정","style":"Body Compact"},{"t 정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 이론·윤리·대상 이해 • 3개월: 프로그램/연구/상담 사례 포트폴리오 • 6개월: 실습·자격·현장경험 확보 • 대표 결과물: 청년 취업준비행동의 영향요인을 설문 설계·통계분석해 정책 개선안을 제시 • 6개월 후 목표: 연구원 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 공감·경청을 활용하는 일을 비교적 즐긴다. □ 진단·분석이 요구되는 문제를 피하지 않는다. □ 연구문제·가설 설정 같은 활동에 흥미가 있다. □ r/spss/sas 등 직무 도구를 배우는 데 거부감이 적다. □ 연구기관 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 청년 취업준비행동의 영향요인을 설문 설계·통계분석해 정책 개선안을 제시. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a-: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 보완 keco 연계 0242 조사 전문가 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한국과학창의재단 2026년 직원 채용 : https://job.alio.go.kr/recruitview.do?idx=298384 • 한국청소년상담복지개발원 2026년 사이버상담원 채용 : https://job.alio.go.kr/recruitview.do?idx=301055 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J15","name":"상담·진로·직업서비스","intro":[{"type":"p","text":"개인의 심리·진로·직업 문제를 진단하고 상담·정보제공·취업알선·사례관리로 변화와 의사결정을 돕는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑤ 교육·연구·상담·복지"],["한 줄 정의","개인의 심리·진로·직업 문제를 진단하고 상담·정보제공·취업알선·사례관리로 변화와 의사결정을 돕는 직무"],["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["대표 시장직무명","직업상담사, 진로상담사, 취업컨설턴트, 심리상담사, 전직지원, Career Coach"],["주요 산업","대학, 고용센터, 민간취업서비스, 상담기관, 공공기관"],["NCS 기반","대표 NCS: 해외취업관리, 경력지도, 직업상담, 취업알선, 전직지원, 청소년상담복지, 진로지원, 심리상담 / 매핑 세분류 8개 / 능력단위 136개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["상담","초기면담·욕구진단","초기면담·욕구진단 관련 자료정리·운영지원·기초분석·현장보조"],["진로","심리·진로검사 해석","심리·진로검사 해석 관련 자료정리·운영지원·기초분석·현장보조"],["직업서비스","상담목표·계획 수립","상담목표·계획 수립 관련 자료정리·운영지원·기초분석·현장보조"]]}],"3. 주요 업무":[{"type":"p","text":"• 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 초기면담·욕구진단·심리·진로검사 해석의 기초업무 수행 • 중기: 독립적으로 상담목표·계획 수립·취업정보·직업정보 제공을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 기록·자료정리·교육콘텐츠·정보검색 보조. 진단·상담·의료 판단은 전문가 책임과 검증이 중요 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 이론·윤리·대상 이해 • 3개월: 프로그램/연구/상담 사례 포트폴리오 • 6개월: 실습·자격·현장경험 확보 • 대표 결과물: 대학생의 가치·흥미·역량·전공·경험을 진단해 직무 후보와 3개월 취업준비계획을 설계 • 6개월 후 목표: 직업상담사 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 공감·경청을 활용하는 일을 비교적 즐긴다. □ 진단·분석이 요구되는 문제를 피하지 않는다. □ 초기면담·욕구진단 같은 활동에 흥미가 있다. □ 상담기록시스템 등 직무 도구를 배우는 데 거부감이 적다. □ 대학 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 대학생의 가치·흥미·역량·전공·경험을 진단해 직무 후보와 3개월 취업준비계획을 설계. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 2314 직업 관련 상담사, 2312 상담 전문가 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한국과학창의재단 2026년 직원 채용 : https://job.alio.go.kr/recruitview.do?idx=298384 • 한국청소년상담복지개발원 2026년 사이버상담원 채용 : https://job.alio.go.kr/recruitview.do?idx=301055 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J16","name":"사회복지·돌봄·보육","intro":[{"type":"p","text":"아동·노인·장애인·취약계층의 욕구를 파악하고 복지서비스·돌봄·보육을 계획·제공·연계하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑤ 교육·연구·상담·복지"],["한 줄 정의","아동·노인·장애인·취약계층의 욕구를 파악하고 복지서비스·돌봄·보육을 계획·제공·연계하는 직무"],["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["대표 시장직무명","사회복지사, 사례관리사, 보육교사, 돌봄코디네이터, 생활복지사, 복지행정"],["주요 산업","복지기관, 지자체, 보육시설, 병원, 공공기관"],["NCS 기반","대표 NCS: :"p","text":"• 관련 전공: 사회복지, 아동·보육, 노인복지, 재활, 가족학","style":"Body Compact"},{"type":"p","text":"• 비전공자: 가능 여부는 직무별 자격·면허·기술장벽에 따라 다름. 전공을 대신할 프로젝트·도구·자격·인턴 Evidence를 확보해야 함.","style":"Body Compact"},{"type":"p","text":"• 추천 전략: 복지기관 분야를 정해 산업지식 + 직무기술을 결합하면 지원서의 구체성이 높아짐.","style":"Body Compact"}],"10. 추천 경험·포트폴리오·자격":[{"type":"p","text":"• 욕구·위기 사정 관련 수업/팀프로젝트","style":"Body Compact"},{"type":"p","text":"• 사례관리을 직접 수행한 산학·공모전·개인프로젝트","style":"Body Compact"},{"type":"p","text":"• 복지기관 기업/기관의 인턴·현장실습·직무체험","style":"Body Compact"},{"type":"p","text":"• 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 프로그램/연구 계획서 또는 포트폴리오","style":"Body Compact"},{"type":"p","text":"• 자격·교육: 사회복지사 / 보육교사","style":"Body Compact"}],"11. 신입 진입도와 현실적 진입경로":[{"type":"table","rows":[["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["직접 진입","사회복지사, 사례관리사, 보육교사 신입·인턴 공고 탐색"],["경유 진입","J15 상담·진로·직업서비스, J17 시민사회·종교·청소년활동, J14 자연·사회과학 연구·조사 등 인접 직무에서 경험 후 이동 가능"],["선발 Evidence","전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 STAR 방식으로 제시"]]}],"12. 산업 연계":[{"type":"p","text":"• 주요 진출 산업: 복지기관, 지자체, 보육시설, 병원, 공공기관","style":"Body Compact"},{"type":"p","text":"• 같은 직무라도 산업에 따라 제품·고객·법규·기술·KPI가 달라지므로 I66 산업과 결합해 탐색하는 것이 효과적.","style":"Body Compact"},{"type":"p","text":"• 학생 질문 예: ‘사회복지·돌봄·보육을 복지기관 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’","style":"Body Compact"}],"13. 실제 채용검색 키워드·유사직무":[{"type":"p","text":"• 검색 키워드: 사회복지사, 사례관리사, 보육교사, 돌봄코디네이터, 생활복지사, 복지행정","style":"Body Compact"},{"type":"p","text":"• 유사·인접 직무: J15 상담·진로·직업서비스, J17 시민사회·종교·청소년활동, J14 자연·사회과학 연구·조사","style":"Body Compact"},{"type":"p","text":"• 검색 팁: J74 정식명칭 하나만 검색하지 말고 기업별 Alias(영문명·통합직무·사업부 직무명)까지 함께 검색","style":"Body Compact"}],"14. 커리어패스":[{"type":"p","text":"• 초기: Junior/Staff/Assistant 수준에서 욕구·위기 사정·사례관리의 기초업무 수행","style":"Body Compact"},{"type":"p","text":"• 중기: 독립적으로 복지프로그램 기획·운영·서비스·자원 연계을 책임지는 Specialist/Senior","style":"Body Compact"},{"type":"p","text":"• 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장","style":"Body Compact"}],"15. AI·자동화 영향":[{"type":"table","rows":[[ star 방식으로 제시 12. 산업 연계 • 주요 진출 산업: 복지기관, 지자체, 보육시설, 병원, 공공기관 • 같은 직무라도 산업에 따라 제품·고객·법규·기술·kpi가 달라지므로 i66 산업과 결합해 탐색하는 것이 효과적. • 학생 질문 예: ‘사회복지·돌봄·보육을 복지기관 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’ 13. 실제 채용검색 키워드·유사직무 • 검색 키워드: 사회복지사, 사례관리사, 보육교사, 돌봄코디네이터, 생활복지사, 복지행정 • 유사·인접 직무: j15 상담·진로·직업서비스, j17 시민사회·종교·청소년활동, j14 자연·사회과학 연구·조사 • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 욕구·위기 사정·사례관리의 기초업무 수행 • 중기: 독립적으로 복지프로그램 기획·운영·서비스·자원 연계을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 기록·자료정리·교육콘텐츠·정보검색 보조. 진단·상담·의료 판단은 전문가 책임과 검증이 중요 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 이론·윤리·대상 이해 • 3개월: 프로그램/연구/상담 사례 포트폴리오 • 6개월: 실습·자격·현장경험 확보 • 대표 결과물: 독거노인의 건강·경제·사회관계 욕구를 평가해 지역자원과 돌봄서비스를 연결하고 변화 추적 • 6개월 후 목표: 사회복지사 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 공감·경청을 활용하는 일을 비교적 즐긴다. □ 진단·분석이 요구되는 문제를 피하지 않는다. □ 욕구·위기 사정 같은 활동에 흥미가 있다. □ 사회복지정보시스템 등 직무 도구를 배우는 데 거부감이 적다. □ 복지기관 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 독거노인의 건강·경제·사회관계 욕구를 평가해 지역자원과 돌봄서비스를 연결하고 변화 추적. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 2311 사회복지사, 2321 보육교사, 5501 요양보호사 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한국과학창의재단 2026년 직원 채용 : https://job.alio.go.kr/recruitview.do?idx=298384 • 한국청소년상담복지개발원 2026년 사이버상담원 채용 : https://job.alio.go.kr/recruitview.do?idx=301055 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J17","name":"시민사회·종교·청소년활동","intro":[{"type":"p","text":"청소년·시민·종교공동체의 참여와 성장을 위해 활동·자원봉사·캠페인·교육 프로 교육을 직접 수행한 산학·공모전·개인프로젝트 • 청소년기관 기업/기관의 인턴·현장실습·직무체험 • 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 프로그램/연구 계획서 또는 포트폴리오 • 자격·교육: 직무 관련 교육·프로젝트 우선, 자격은 채용공고 우대요건 확인 11. 신입 진입도와 현실적 진입경로 신입 진입도 ★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨) 직접 진입 청소년지도사, 자원봉사 코디네이터, ngo 활동가 신입·인턴 공고 탐색 경유 진입 j16 사회복지·돌봄·보육, j15 상담·진로·직업서비스, j14 자연·사회과학 연구·조사 등 인접 직무에서 경험 후 이동 가능 선발 evidence 전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 star 방식으로 제시 12. 산업 연계 • 주요 진출 산업: 청소년기관, ngo, 종교기관, 지자체, 사회적경제 • 같은 직무라도 산업에 따라 제품·고객·법규·기술·kpi가 달라지므로 i66 산업과 결합해 탐색하는 것이 효과적. • 학생 질문 예: ‘시민사회·종교·청소년활동을 청소년기관 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’ 13. 실제 채용검색 키워드·유사직무 • 검색 키워드: 청소년지도사, 자원봉사 코디네이터, ngo 활동가, 프로그램 매니저, 시민교육, community manager • 유사·인접 직무: j16 사회복지·돌봄·보육, j15 상담·진로·직업서비스, j14 자연·사회과학 연구·조사 • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 청소년활동 기획·자원봉사자 모집·교육의 기초업무 수행 • 중기: 독립적으로 프로그램 운영·지역네트워크 구축을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 기록·자료정리·교육콘텐츠·정보검색 보조. 진단·상담·의료 판단은 전문가 책임과 검증이 중요 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 이론·윤리·대상 이해 • 3개월: 프로그램/연구/상담 사례 포트폴리오 • 6개월: 실습·자격·현장경험 확보 • 대표 결과물: 지역 청소년 진로캠프를 기획해 참가자 모집·안전·멘토·예산·성과평가를 통합 운영 • 6개월 후 목표: 청소년지도사 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 공감·경청을 활용하는 일을 비교적 즐긴다. □ 진단·분석이 요구되는 문제를 피하지 않는다. □ 청소년활동 기획 같은 활동에 흥미가 있다. □ 문서·excel 등 직무 도구를 배우는 데 거부감이 적다. □ 청소년기관 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 지역 청소년 진로캠프를 기획해 참가자 모집·안전·멘토·예산·성과평가를 통합 운영. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a-: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 보완 keco 연계 2311 사회복지사, 2313 청소년 지도사 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한국과학창의재단 2026년 직원 채용 : https://job.alio.go.kr/recruitview.do?idx=298384 • 한국청소년상  따라 다름. 전공을 대신할 프로젝트·도구·자격·인턴 evidence를 확보해야 함. • 추천 전략: 보건기관 분야를 정해 산업지식 + 직무기술을 결합하면 지원서의 구체성이 높아짐. 10. 추천 경험·포트폴리오·자격 • 건강위험·위생 실태조사 관련 수업/팀프로젝트 • 보건교육을 직접 수행한 산학·공모전·개인프로젝트 • 보건기관 기업/기관의 인턴·현장실습·직무체험 • 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 보건·의료 기록 또는 포트폴리오 • 자격·교육: 보건교육사·위생사·산업위생 관련 자격(분야별) 11. 신입 진입도와 현실적 진입경로 신입 진입도 ★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨) 직접 진입 보건관리자, 보건교육사, 위생사 신입·인턴 공고 탐색 경유 진입 j19 의료·간호·진료지원, j20 의료기술·재활·의료행정 등 인접 직무에서 경험 후 이동 가능 선발 evidence 전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 star 방식으로 제시 12. 산업 연계 • 주요 진출 산업: 보건기관, 공공기관, 산업현장, 학교, 건강서비스 • 같은 직무라도 산업에 따라 제품·고객·법규·기술·kpi가 달라지므로 i66 산업과 결합해 탐색하는 것이 효과적. • 학생 질문 예: ‘보건·공중보건·건강관리을 보건기관 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’ 13. 실제 채용검색 키워드·유사직무 • 검색 키워드: 보건관리자, 보건교육사, 위생사, 건강증진 담당, 공중보건, health coordinator • 유사·인접 직무: j19 의료·간호·진료지원, j20 의료기술·재활·의료행정 • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 건강위험·위생 실태조사·보건교육의 기초업무 수행 • 중기: 독립적으로 감염·위생 관리·건강증진 프로그램을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 기록·자료정리·교육콘텐츠·정보검색 보조. 진단·상담·의료 판단은 전문가 책임과 검증이 중요 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 직무별 면허·법규·안전 기준 확인 • 3개월: 실습/프로젝트와 기록역량 강화 • 6개월: 임상·현장실습, 자격·면허 및 기관 맞춤 준비 • 대표 결과물: 사업장 건강검진과 유해요인 데이터를 분석해 근골격계·만성질환 예방 프로그램을 운영 • 6개월 후 목표: 보건관리자 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 정확성을 활용하는 일을 비교적 즐긴다. □ 관찰력이 요구되는 문제를 피하지 않는다. □ 건강위험·위생 실태조사 같은 활동에 흥미가 있다. □ excel/통계도구 등 직무 도구를 배우는 데 거부감이 적다. □ 보건기관 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 사업장 건강검진과 유해요인 데이터를 분석해 근골격계·만성질환 예방 프로그램을 운영. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 3072 위생사 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 아짐. 10. 추천 경험·포트폴리오·자격 • 환자·대상자 관찰 관련 수업/팀프로젝트 • 진료·간호 보조을 직접 수행한 산학·공모전·개인프로젝트 • 병원 기업/기관의 인턴·현장실습·직무체험 • 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 보건·의료 기록 또는 포트폴리오 • 자격·교육: 직종별 법정 면허·자격 확인 필수 11. 신입 진입도와 현실적 진입경로 신입 진입도 ★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨) 직접 진입 간호사, 간호조무, 요양보호 신입·인턴 공고 탐색 경유 진입 j18 보건·공중보건·건강관리, j20 의료기술·재활·의료행정 등 인접 직무에서 경험 후 이동 가능 선발 evidence 전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 star 방식으로 제시 12. 산업 연계 • 주요 진출 산업: 병원, 요양시설, 보건소, 재활기관, 돌봄서비스 • 같은 직무라도 산업에 따라 제품·고객·법규·기술·kpi가 달라지므로 i66 산업과 결합해 탐색하는 것이 효과적. • 학생 질문 예: ‘의료·간호·진료지원을 병원 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’ 13. 실제 채용검색 키워드·유사직무 • 검색 키워드: 간호사, 간호조무, 요양보호, 진료지원, care worker, clinical support • 유사·인접 직무: j18 보건·공중보건·건강관리, j20 의료기술·재활·의료행정 • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 환자·대상자 관찰·진료·간호 보조의 기초업무 수행 • 중기: 독립적으로 투약·처치 지원·일상생활 지원을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 기록·자료정리·교육콘텐츠·정보검색 보조. 진단·상담·의료 판단은 전문가 책임과 검증이 중요 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 직무별 면허·법규·안전 기준 확인 • 3개월: 실습/프로젝트와 기록역량 강화 • 6개월: 임상·현장실습, 자격·면허 및 기관 맞춤 준비 • 대표 결과물: 환자의 활력징후·식사·통증·이동상태를 관찰해 기록하고 이상징후를 의료진에게 즉시 공유 • 6개월 후 목표: 간호사 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 정확성을 활용하는 일을 비교적 즐긴다. □ 관찰력이 요구되는 문제를 피하지 않는다. □ 환자·대상자 관찰 같은 활동에 흥미가 있다. □ emr 등 직무 도구를 배우는 데 거부감이 적다. □ 병원 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 환자의 활력징후·식사·통증·이동상태를 관찰해 기록하고 이상징후를 의료진에게 즉시 공유. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a-: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 보완 keco 연계 5501 요양보호사 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한국식품안전관리인증원 2026년 신규직원 채용 : https://job.alio.go.kr/recruitview.do?idx=299843 • 한국보건의료인국가시험원 2026년 신규직원 채용 : https://jo 전공과 비전공자 진입 • 관련 전공: 보건의료정보, 재활, 임상심리, 의공학, 병원행정 • 비전공자: 가능 여부는 직무별 자격·면허·기술장벽에 따라 다름. 전공을 대신할 프로젝트·도구·자격·인턴 evidence를 확보해야 함. • 추천 전략: 병원 분야를 정해 산업지식 + 직무기술을 결합하면 지원서의 구체성이 높아짐. 10. 추천 경험·포트폴리오·자격 • 의료기기·검사 지원 관련 수업/팀프로젝트 • 재활·보조기기 서비스을 직접 수행한 산학·공모전·개인프로젝트 • 병원 기업/기관의 인턴·현장실습·직무체험 • 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 보건·의료 기록 또는 포트폴리오 • 자격·교육: 직종별 법정 면허·자격 확인 필수 11. 신입 진입도와 현실적 진입경로 신입 진입도 ★★★☆☆ 보통~다소 어려움(직무증거·전문성 중요) 직접 진입 보건의료정보관리사, 임상심리사, 의공기사 신입·인턴 공고 탐색 경유 진입 j19 의료·간호·진료지원, j18 보건·공중보건·건강관리 등 인접 직무에서 경험 후 이동 가능 선발 evidence 전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 star 방식으로 제시 12. 산업 연계 • 주요 진출 산업: 병원, 의료기기업체, 재활기관, 건강보험·공공, 헬스케어 • 같은 직무라도 산업에 따라 제품·고객·법규·기술·kpi가 달라지므로 i66 산업과 결합해 탐색하는 것이 효과적. • 학생 질문 예: ‘의료기술·재활·의료행정을 병원 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’ 13. 실제 채용검색 키워드·유사직무 • 검색 키워드: 보건의료정보관리사, 임상심리사, 의공기사, 재활공학, 병원행정, 원무 • 유사·인접 직무: j19 의료·간호·진료지원, j18 보건·공중보건·건강관리 • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 의료기기·검사 지원·재활·보조기기 서비스의 기초업무 수행 • 중기: 독립적으로 임상심리 평가·의료정보·의무기록 관리을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 기록·자료정리·교육콘텐츠·정보검색 보조. 진단·상담·의료 판단은 전문가 책임과 검증이 중요 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 직무별 면허·법규·안전 기준 확인 • 3개월: 실습/프로젝트와 기록역량 강화 • 6개월: 임상·현장실습, 자격·면허 및 기관 맞춤 준비 • 대표 결과물: 의료기록의 누락·오류 데이터를 분석해 코드 정확도와 진료정보 품질을 개선 • 6개월 후 목표: 보건의료정보관리사 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 정확성을 활용하는 일을 비교적 즐긴다. □ 관찰력이 요구되는 문제를 피하지 않는다. □ 의료기기·검사 지원 같은 활동에 흥미가 있다. □ emr/his 등 직무 도구를 배우는 데 거부감이 적다. □ 병원 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 의료기록의 누락·오류 데이터를 분석해 코드 정확도와 진료정보 품질을 개선. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 1533 전자공학 기술자 및 연구원, 3067 재활공학 기사, 3068 언어 및 청각능력 재활 심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 지역 청년예술제를 기획해 프로그램·예산·출연진·홍보·현장운영·관객성과를 관리. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 4171 공연 및 시각예술 기획자, 4131 학예사 및 문화재 보존원, 0136 문화·예술 관련 관리자, 4132 사서 및 기록물관리사, 4145 지휘자·작곡가 및 연주가 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한국문화예술위원회 2026년 신입사원 채용 : https://job.alio.go.kr/recruitview.do?idx=301227 • 한국공예디자인문화진흥원 2026년 채용 : https://job.alio.go.kr/recruitview.do?idx=302313 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J22","name":"디자인","intro":[{"type":"p","text":"사용자와 브랜드의 문제를 시각·제품·공간·디지털 경험으로 해석해 형태와 경험을 설계하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑦ 문화·콘텐츠·디자인·미디어"],["한 줄 정의","사용자와 브랜드의 문제를 시각·제품·공간·디지털 경험으로 해석해 형태와 경험을 설계하는 직무"],["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["대표 시장직무명","그래픽디자이너, UX/UI Designer, Product Designer, 산업디자이너, BX Designer, 공간디자이너"],["주요 산업","IT, 소비재, 제조, 광고, 건축·리테일"],["NCS 기반","대표 NCS: 시각디자인, 제품디자인, 환경디자인, 디지털디자인, 텍스타일디자인, 서비스경험디자인, 실내디자인, 색채디자인 / 매핑 세분류 11개 / 능력단위 150개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["디자인","사용자·시장 리서치","사용자·시장 리서치 관련 자료정리·운영지원·기초분석·현장보조"]]}],"3. 주요 업무":[{"type":"p","text":"• 사용자·시장 리서치","style":"Body Compact"},{"type":"p","text":"• 컨셉·아이디어 도출","style":"Body Compact"},{"type":"p","text":"• 그래픽·제품·UI/UX 설계","style":"Body Compact"},{"type":"p","text":"• 프로토타입 제작","style":"Body Compact"},{"type":"p","text":"• 디자인 시스템·가이드","style":"Body Compact"},{"type":"p","text":"• 사용성 검증·수정","style":"Body Compact"}],"4. 신입사원이 실제로 많이 맡는 업무":[{"type":"p","text":"• 사용자·시장 리서치을 위한 자료수집·기초 데이터 정리","style":"Body Compact"},{"type":"p","text":"• 컨셉·아이디어 도출 관련 일정·문서·운영 보조","style":"Body Compact"},{"type":"p","text":"• 그래픽·제품·UI/UX 설계 관련 지표 업데이트·현황 모니터링","style":"Body Compact"},{"type":"p","text":"• 회의·현장·프로젝트 후 결과 기록과 보고자료 초안 작성","style":"Body Compact"},{"type":"p","text":"• 선배/전문가의 검토를 받아 업무 기준·툴·품질기준을 학습","style":"Body Compact"}],"5. 업무 프로세스":[{"type":"p","text":"리서치 → 콘셉트/기획 → 제작 → 검토·수정 → 공개/운영 → 사용자·관객 반응 분석","style":"Body Compact"}],"6. 주요 산출물과 KPI":[{"type":"table","rows":[["대표 산출물","대표 KPI"],["기획안·콘셉트","조회·관람·사용자 반응"],["포트폴리오·시안","프로젝트 일정·예산"],["완성 콘텐츠/작품","콘텐츠/디자인 품질"],["제작·운영계획","전환·판매·매출"],["성과·관객/사용자 분석","포트폴리오·재사용 성과"]]}],"7. 필요한 KSA(Knowledge·Skill·Ability)":[{"type":"table","rows":[["Knowledge","콘텐츠·디자인 이론, 사용자/관객 이해, 스토리텔링, 저작권, 제작·유통"],["Skill","사용자, 컨셉, 그래픽, 데이터·문서화, 협업·보고"],["Ability","창의성, 기획력, 사용자·관객 이해, 표현력, 도구활용, 협업"],["Tool","Figma, Adobe CC, 3D/CAD 도구, 프로토타이핑, 생성형 이미지 AI"]]}],"8. 직무 적합성 프로파일":[{"type":"table","rows":[["가치","창의·표현·자율·영향력·전문성"],["흥미(Holland)","A 예술형 + E 기업형 + I 탐구형"],["업무방식","프로젝트·마감 중심, 협업과 피드백 반복, 포트폴리오로 역량을 증명하는 비중이 큼"],["잘 맞는 학생","창의성·기획력을 강점으로 쓰고, 사용자·시장 리서치 같은 문제를 탐구/실행하는 학생"],["주의할 점","직무명만 보고 선택하지 말고 실제 현장·근무시간·자격·성과압력·고객접점 여부를 채용공고로 확인"]]}],"9. 관련 전공과 비전공자 진입":[{"type":"p","text":"• 관련 전공: 시각디자인, 산업디자인, UX/UI, 공간디자인, 패션·텍스타일","style":"Body Compact"},{"type":"p","text":"• 비전공자: 가능 여부는 직무별 자격·면허·기술장벽에 따라 다름. 전공을 대신할 프로젝트·도구·자격·인턴 Evidence를 확보해야 함.","style":"Body Compact"},{"type":"p","text":"• 추천 전략: IT 분야를 정해 산업지식 + 직무기술을 결합하면 지원서의 구체성이 높아짐.","style":"Body Compact"}],"10. 추천 경험·포트폴리오·자격":[{"type":"p","text":"• 사용자·시장 리서치 관련 수업/팀프로젝트","style":"Body Compact"},{"type":"p","text":"• 컨셉·아이디어 도출을 직접 수행한 산학·공모전·개인프로젝트","style":"Body Compact"},{"type":"p","text":"• IT 기업/기관의 인턴·현장실습·직무체험","style":"Body Compact"},{"type":"p","text":"• 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 기획안·콘셉트 또는 포트폴리오","style":"Body Compact"},{"type":"p","text":"• 자격·교육: 자격증보다 포트폴리오 우선","style":"Body Compact"}],"11. 신입 진입도와 현실적 진입경로":[{"type":"table","rows":[["신입 진입도","★★★★☆ 보통~양  준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 레퍼런스 분석과 핵심 툴 • 3개월: 포트폴리오 2~3개 • 6개월: 실제 프로젝트·공모전·인턴·프리랜스 경험 • 대표 결과물: 대학생 취업앱의 사용자 인터뷰를 통해 탐색 문제를 정의하고 figma 프로토타입으로 개선 • 6개월 후 목표: 그래픽디자이너 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 창의성을 활용하는 일을 비교적 즐긴다. □ 기획력이 요구되는 문제를 피하지 않는다. □ 사용자·시장 리서치 같은 활동에 흥미가 있다. □ figma 등 직무 도구를 배우는 데 거부감이 적다. □ it 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 대학생 취업앱의 사용자 인터뷰를 통해 탐색 문제를 정의하고 figma 프로토타입으로 개선. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 4154 시각 디자이너, 4153 실내장식 디자이너, 4152 패션 디자이너, 4151 제품 디자이너, 4155 미디어 콘텐츠 디자이너 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한국문화예술위원회 2026년 신입사원 채용 : https://job.alio.go.kr/recruitview.do?idx=301227 • 한국공예디자인문화진흥원 2026년 채용 : https://job.alio.go.kr/recruitview.do?idx=302313 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J23","name":"디지털콘텐츠·게임","intro":[{"type":"p","text":"게임·VR·웹툰·애니메이션·음악 등 디지털 IP와 콘텐츠를 기획·제작·서비스해 이용자 경험과 매출을 만드는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑦ 문화·콘텐츠·디자인·미디어"],["한 줄 정의","게임·VR·웹툰·애니메이션·음악 등 디지털 IP와 콘텐츠를 기획·제작·서비스해 이용자 경험과 매출을 만드는 직무"],["신입 진입도","★★★☆☆ 보통~다소 어려움(직무증거·전문성 중요)"],["대표 시장직무명","게임기획, 콘텐츠기획, 레벨디자인, 게임운영, 콘텐츠PD, IP기획"],["주요 산업","게임, 웹툰, 메타버스, 음악, 엔터테인먼트"],["NCS 기반","대표 NCS: VR콘텐츠디자인, 문화콘텐츠기획, 음악콘텐츠제작, 광고콘텐츠제작, 게임콘텐츠제작, 애니메이션콘텐츠제작, 만화콘텐츠제작, 캐릭터콘텐츠제작 / 매핑 세분류 22개 / 능력단위 268개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["디지털콘텐츠","콘텐츠/IP 기획","콘텐츠/IP 기획 관련 자료정리·운영지원·기초분석·현장보조"],["게임","세계관·스토리·레벨 설계","세계관·스토리·레벨 설계 관련 자료정리·운영지원·기초분석·현장보조"]]}]," 스 • 초기: junior/staff/assistant 수준에서 콘텐츠/ip 기획·세계관·스토리·레벨 설계의 기초업무 수행 • 중기: 독립적으로 콘텐츠 제작·라이브서비스 운영을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 아이디어·시안·편집 보조, 생성형 콘텐츠, 반복 제작·메타데이터 자동화 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 레퍼런스 분석과 핵심 툴 • 3개월: 포트폴리오 2~3개 • 6개월: 실제 프로젝트·공모전·인턴·프리랜스 경험 • 대표 결과물: 모바일 게임의 신규 이벤트 구조·보상·kpi를 설계하고 이용자 잔존율과 결제율로 개선 • 6개월 후 목표: 게임기획 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 창의성을 활용하는 일을 비교적 즐긴다. □ 기획력이 요구되는 문제를 피하지 않는다. □ 콘텐츠/ip 기획 같은 활동에 흥미가 있다. □ unity/unreal 등 직무 도구를 배우는 데 거부감이 적다. □ 게임 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 모바일 게임의 신규 이벤트 구조·보상·kpi를 설계하고 이용자 잔존율과 결제율로 개선. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 4155 미디어 콘텐츠 디자이너 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한국문화예술위원회 2026년 신입사원 채용 : https://job.alio.go.kr/recruitview.do?idx=301227 • 한국공예디자인문화진흥원 2026년 채용 : https://job.alio.go.kr/recruitview.do?idx=302313 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J24","name":"방송·영상제작","intro":[{"type":"p","text":"방송·영화·영상 콘텐츠를 기획하고 촬영·연출·편집·기술운영을 통해 완성된 영상으로 제작·유통하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑦ 문화·콘텐츠·디자인·미디어"],["한 줄 정의","방송·영화·영상 콘텐츠를 기획하고 촬영·연출·편집·기술운영을 통해 완성된 영상으로 제작·유통하는 직무"],["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["대표 시장직무명","PD, 영상기획, 촬영감독, 영상편집, 방송기술, Video Producer"],["주요 산업","방송사, OTT, 광고, 유튜브·MCN, 영화"],["NCS 기반","대표 NCS: 방송콘텐츠제작, 영화콘텐츠제작, 영사, 드론콘텐츠제작, 방송콘텐츠유통·서비스, 영화콘텐츠유통·서비스, 영상연출, 영상촬영 / 매핑 세분류 26개 , 촬영감독, 영상편집, 방송기술, video producer • 유사·인접 직무: j23 디지털콘텐츠·게임, j25 출판·언론·사진, j22 디자인 • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 아이템·대본 기획·연출·제작관리의 기초업무 수행 • 중기: 독립적으로 촬영·조명·음향·편집·후반작업을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 아이디어·시안·편집 보조, 생성형 콘텐츠, 반복 제작·메타데이터 자동화 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 레퍼런스 분석과 핵심 툴 • 3개월: 포트폴리오 2~3개 • 6개월: 실제 프로젝트·공모전·인턴·프리랜스 경험 • 대표 결과물: 기업 홍보영상의 콘티·촬영계획·인터뷰·편집을 수행하고 조회·완주율을 분석 • 6개월 후 목표: pd 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 창의성을 활용하는 일을 비교적 즐긴다. □ 기획력이 요구되는 문제를 피하지 않는다. □ 아이템·대본 기획 같은 활동에 흥미가 있다. □ premiere pro 등 직무 도구를 배우는 데 거부감이 적다. □ 방송사 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 기업 홍보영상의 콘티·촬영계획·인터뷰·편집을 수행하고 조회·완주율을 분석. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 4164 촬영기사, 4161 감독 및 기술 감독, 4166 영상·녹화 및 편집 기사 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한국문화예술위원회 2026년 신입사원 채용 : https://job.alio.go.kr/recruitview.do?idx=301227 • 한국공예디자인문화진흥원 2026년 채용 : https://job.alio.go.kr/recruitview.do?idx=302313 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J25","name":"출판·언론·사진","intro":[{"type":"p","text":"책·기사·사진 등 정보와 이야기를 취재·편집·출판·시각화해 독자에게 정확하고 매력적으로 전달하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑦ 문화·콘텐츠·디자인·미디어"],["한 줄 정의","책·기사·사진 등 정보와 이야기를 취재·편집·출판·시각화해 독자에게 정확하고 매력적으로 전달하는 직무"],["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["대표 시장직무명","기자, 에디터, 출판기획, 교  전공과 비전공자 진입":[{"type":"p","text":"• 관련 전공: 언론정보, 문예창작, 출판, 사진, 국문·인문","style":"Body Compact"},{"type":"p","text":"• 비전공자: 가능 여부는 직무별 자격·면허·기술장벽에 따라 다름. 전공을 대신할 프로젝트·도구·자격·인턴 Evidence를 확보해야 함.","style":"Body Compact"},{"type":"p","text":"• 추천 전략: 언론 분야를 정해 산업지식 + 직무기술을 결합하면 지원서의 구체성이 높아짐.","style":"Body Compact"}],"10. 추천 경험·포트폴리오·자격":[{"type":"p","text":"• 취재·자료조사 관련 수업/팀프로젝트","style":"Body Compact"},{"type":"p","text":"• 기사·원고 작성을 직접 수행한 산학·공모전·개인프로젝트","style":"Body Compact"},{"type":"p","text":"• 언론 기업/기관의 인턴·현장실습·직무체험","style":"Body Compact"},{"type":"p","text":"• 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 기획안·콘셉트 또는 포트폴리오","style":"Body Compact"},{"type":"p","text":"• 자격·교육: 직무 관련 교육·프로젝트 우선, 자격은 채용공고 우대요건 확인","style":"Body Compact"}],"11. 신입 진입도와 현실적 진입경로":[{"type":"table","rows":[["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["직접 진입","기자, 에디터, 출판기획 신입·인턴 공고 탐색"],["경유 진입","J24 방송·영상제작, J23 디지털콘텐츠·게임, J22 디자인 등 인접 직무에서 경험 후 이동 가능"],["선발 Evidence","전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 STAR 방식으로 제시"]]}],"12. 산업 연계":[{"type":"p","text":"• 주요 진출 산업: 언론, 출판, 온라인미디어, 기업콘텐츠, 사진","style":"Body Compact"},{"type":"p","text":"• 같은 직무라도 산업에 따라 제품·고객·법규·기술·KPI가 달라지므로 I66 산업과 결합해 탐색하는 것이 효과적.","style":"Body Compact"},{"type":"p","text":"• 학생 질문 예: ‘출판·언론·사진을 언론 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’","style":"Body Compact"}],"13. 실제 채용검색 키워드·유사직무":[{"type":"p","text":"• 검색 키워드: 기자, 에디터, 출판기획, 교정교열, 포토그래퍼, Content Editor","style":"Body Compact"},{"type":"p","text":"• 유사·인접 직무: J24 방송·영상제작, J23 디지털콘텐츠·게임, J22 디자인","style":"Body Compact"},{"type":"p","text":"• 검색 팁: J74 정식명칭 하나만 검색하지 말고 기업별 Alias(영문명·통합직무·사업부 직무명)까지 함께 검색","style":"Body Compact"}],"14. 커리어패스":[{"type":"p","text":"• 초기: Junior/Staff/Assistant 수준에서 취재·자료조사·기사·원고 작성의 기초업무 수행","style":"Body Compact"},{"type":"p","text":"• 중기: 독립적으로 출판기획·교정·교열·편집을 책임지는 Specialist/Senior","style":"Body Compact"},{"type":"p","text":"• 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장","style":"Body Compact"}],"15. AI·자동화 영향":[{"type":"table","rows":[["AI가 빠르게 보조 itor • 유사·인접 직무: j24 방송·영상제작, j23 디지털콘텐츠·게임, j22 디자인 • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 취재·자료조사·기사·원고 작성의 기초업무 수행 • 중기: 독립적으로 출판기획·교정·교열·편집을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 아이디어·시안·편집 보조, 생성형 콘텐츠, 반복 제작·메타데이터 자동화 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 레퍼런스 분석과 핵심 툴 • 3개월: 포트폴리오 2~3개 • 6개월: 실제 프로젝트·공모전·인턴·프리랜스 경험 • 대표 결과물: 산업 이슈를 취재해 데이터와 인터뷰를 결합한 기획기사를 작성하고 독자반응을 분석 • 6개월 후 목표: 기자 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 창의성을 활용하는 일을 비교적 즐긴다. □ 기획력이 요구되는 문제를 피하지 않는다. □ 취재·자료조사 같은 활동에 흥미가 있다. □ word/hwp 등 직무 도구를 배우는 데 거부감이 적다. □ 언론 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 산업 이슈를 취재해 데이터와 인터뷰를 결합한 기획기사를 작성하고 독자반응을 분석. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 4113 출판물 전문가, 4142 사진기자 및 사진사 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한국문화예술위원회 2026년 신입사원 채용 : https://job.alio.go.kr/recruitview.do?idx=301227 • 한국공예디자인문화진흥원 2026년 채용 : https://job.alio.go.kr/recruitview.do?idx=302313 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J26","name":"뷰티·미용·반려동물미용","intro":[{"type":"p","text":"헤어·피부·메이크업·네일·반려동물 미용 서비스를 통해 외모·건강·스타일을 관리하고 고객 만족을 만드는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑧ 관광·숙박·외식·스포츠·생활서비스"],["한 줄 정의","헤어·피부·메이크업·네일·반려동물 미용 서비스를 통해 외모·건강·스타일을 관리하고 고객 만족을 만드는 직무"],["신입 진입도","★★★★★ 양호(신입·현장형 진입기회가 비교적 넓음)"],["대표 시장직무명","헤어디자이너, 피부관리사, 메이크업아티스트, 네일아티스트, 펫미용사, Beauty Specialis 름. 전공을 대신할 프로젝트·도구·자격·인턴 evidence를 확보해야 함. • 추천 전략: 웨딩 분야를 정해 산업지식 + 직무기술을 결합하면 지원서의 구체성이 높아짐. 10. 추천 경험·포트폴리오·자격 • 고객 요구상담 관련 수업/팀프로젝트 • 행사·서비스 계획을 직접 수행한 산학·공모전·개인프로젝트 • 웨딩 기업/기관의 인턴·현장실습·직무체험 • 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 서비스 운영계획 또는 포트폴리오 • 자격·교육: 직무 관련 교육·프로젝트 우선, 자격은 채용공고 우대요건 확인 11. 신입 진입도와 현실적 진입경로 신입 진입도 ★★★★★ 양호(신입·현장형 진입기회가 비교적 넓음) 직접 진입 웨딩플래너, 장례지도사, 생활서비스 매니저 신입·인턴 공고 탐색 경유 진입 j26 뷰티·미용·반려동물미용, j28 숙박·관광·여행, j29 외식·조리·식음 등 인접 직무에서 경험 후 이동 가능 선발 evidence 전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 star 방식으로 제시 12. 산업 연계 • 주요 진출 산업: 웨딩, 장례, 생활서비스, 시설관리, 플랫폼 • 같은 직무라도 산업에 따라 제품·고객·법규·기술·kpi가 달라지므로 i66 산업과 결합해 탐색하는 것이 효과적. • 학생 질문 예: ‘생활·웨딩·장례·청소서비스을 웨딩 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’ 13. 실제 채용검색 키워드·유사직무 • 검색 키워드: 웨딩플래너, 장례지도사, 생활서비스 매니저, 환경미화관리, 가사지원, service coordinator • 유사·인접 직무: j26 뷰티·미용·반려동물미용, j28 숙박·관광·여행, j29 외식·조리·식음 • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 고객 요구상담·행사·서비스 계획의 기초업무 수행 • 중기: 독립적으로 협력업체·일정 조정·현장 서비스 수행을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 자료검색·요약, 초안 작성, 반복 문서화, 데이터 전처리·패턴 탐색 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 현장서비스와 업종 기본기 • 3개월: 서비스 개선/운영 포트폴리오 • 6개월: 현장실습·인턴·자격 및 고객응대 경험 • 대표 결과물: 웨딩 고객의 예산·일정·장소·업체 요구를 통합해 당일 운영까지 관리 • 6개월 후 목표: 웨딩플래너 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 서비스마인드을 활용하는 일을 비교적 즐긴다. □ 대인관계이 요구되는 문제를 피하지 않는다. □ 고객 요구상담 같은 활동에 흥미가 있다. □ 예약/crm 등 직무 도구를 배우는 데 거부감이 적다. □ 웨딩 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 웨딩 고객의 예산·일정·장소·업체 요구를 통합해 당일 운영까지 관리. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 5121 결혼 상담원 및 웨딩플래너, 5123 장례 지도사 및 장례 상담원, 5611 건물 청소원, 5633 가사 도우미, 5632 세탁원 및 다림질원 확인일 2026-09-09 • 국가직무능력표준(ncs) : https  조리장비, pos, 재고/발주 시스템, excel, 위생관리 도구 8. 직무 적합성 프로파일 가치 고객만족·활동성·관계·서비스·성취 흥미(holland) s 사회형 + e 기업형 + r 현실형 업무방식 현장·고객접점 비중이 높고 교대·주말근무 가능성, 즉각적 문제대응이 중요 잘 맞는 학생 서비스마인드·대인관계을 강점으로 쓰고, 식재료 준비·검수 같은 문제를 탐구/실행하는 학생 주의할 점 직무명만 보고 선택하지 말고 실제 현장·근무시간·자격·성과압력·고객접점 여부를 채용공고로 확인 9. 관련 전공과 비전공자 진입 • 관련 전공: 조리, 외식경영, 식품, 호텔, 제과제빵 • 비전공자: 가능 여부는 직무별 자격·면허·기술장벽에 따라 다름. 전공을 대신할 프로젝트·도구·자격·인턴 evidence를 확보해야 함. • 추천 전략: 외식 분야를 정해 산업지식 + 직무기술을 결합하면 지원서의 구체성이 높아짐. 10. 추천 경험·포트폴리오·자격 • 식재료 준비·검수 관련 수업/팀프로젝트 • 조리·레시피 표준화을 직접 수행한 산학·공모전·개인프로젝트 • 외식 기업/기관의 인턴·현장실습·직무체험 • 결과물: ‘문제 → 분석 → 실행 → 결과’가 보이는 서비스 운영계획 또는 포트폴리오 • 자격·교육: 직무 관련 교육·프로젝트 우선, 자격은 채용공고 우대요건 확인 11. 신입 진입도와 현실적 진입경로 신입 진입도 ★★★★★ 양호(신입·현장형 진입기회가 비교적 넓음) 직접 진입 조리사, 셰프, 바리스타 신입·인턴 공고 탐색 경유 진입 j28 숙박·관광·여행, j30 스포츠, j27 생활·웨딩·장례·청소서비스 등 인접 직무에서 경험 후 이동 가능 선발 evidence 전공/자격만이 아니라 실제 과제·프로젝트·현장경험·툴 활용 결과물을 star 방식으로 제시 12. 산업 연계 • 주요 진출 산업: 외식, 호텔, 급식, 프랜차이즈, 식품기업 • 같은 직무라도 산업에 따라 제품·고객·법규·기술·kpi가 달라지므로 i66 산업과 결합해 탐색하는 것이 효과적. • 학생 질문 예: ‘외식·조리·식음을 외식 산업에서 수행하면 실제 업무가 어떻게 달라지는가?’ 13. 실제 채용검색 키워드·유사직무 • 검색 키워드: 조리사, 셰프, 바리스타, 소믈리에, f&b manager, 메뉴개발 • 유사·인접 직무: j28 숙박·관광·여행, j30 스포츠, j27 생활·웨딩·장례·청소서비스 • 검색 팁: j74 정식명칭 하나만 검색하지 말고 기업별 alias(영문명·통합직무·사업부 직무명)까지 함께 검색 14. 커리어패스 • 초기: junior/staff/assistant 수준에서 식재료 준비·검수·조리·레시피 표준화의 기초업무 수행 • 중기: 독립적으로 위생·haccp 관리·식음료 서비스을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 자료검색·요약, 초안 작성, 반복 문서화, 데이터 전처리·패턴 탐색 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 현장서비스와 업종 기본기 • 3개월: 서비스 개선/운영 포트폴리오 • 6개월: 현장실습·인턴·자격 및 고객응대 경험 • 대표 결과물: 메뉴별 원가·판매량·고객평가를 분석해 수익성과 만족도가 높은 시즌 메뉴를 개선 • 6개월 후 목표: 조리사 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 서비스마인드을 활용하는 일을 비교적 즐긴다. □ 대인관계이 요구되는 문제를 피하지 않는다. □ 식재료 준비·검수 같은 활동에 흥미가 있다. □ 조리장비 등 직무 도구를 배우는 데 거부감이 적다. □ 외식 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검 스트입니다. 18. 실무 사례 축구선수 경기영상과 gps 데이터를 분석해 활동량·스프린트·포지셔닝 개선안을 제시. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 4204 스포츠 강사 및 트레이너 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한국관광공사 2026년 일반직 신입사원 채용 : https://job.alio.go.kr/recruitview.do?idx=301369 • 롯데그룹 채용 : https://recruit.lotte.co.kr/ • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J31","name":"레저·오락·카지노·리조트","intro":[{"type":"p","text":"리조트·카지노·테마파크·크루즈 등 레저시설의 고객경험과 게임·시설·매출을 안전하게 운영하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑧ 관광·숙박·외식·스포츠·생활서비스"],["한 줄 정의","리조트·카지노·테마파크·크루즈 등 레저시설의 고객경험과 게임·시설·매출을 안전하게 운영하는 직무"],["신입 진입도","★★★★★ 양호(신입·현장형 진입기회가 비교적 넓음)"],["대표 시장직무명","리조트 운영, 카지노 딜러, 카지노 운영, 테마파크 운영, 크루즈 운영, Leisure Operations"],["주요 산업","리조트, 카지노, 테마파크, 크루즈, 복합레저"],["NCS 기반","대표 NCS: 카지노기획개발, 카지노운영관리, 크루즈운영관리, 유원시설운영관리, 리조트운영관리 / 매핑 세분류 5개 / 능력단위 59개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["레저","고객서비스","고객서비스 관련 자료정리·운영지원·기초분석·현장보조"],["오락","게임·시설 운영","게임·시설 운영 관련 자료정리·운영지원·기초분석·현장보조"],["카지노","객실·부대시설 연계","객실·부대시설 연계 관련 자료정리·운영지원·기초분석·현장보조"],["리조트","이벤트·프로모션","이벤트·프로모션 관련 자료정리·운영지원·기초분석·현장보조"]]}],"3. 주요 업무":[{"type":"p","text":"• 고객서비스","style":"Body Compact"},{"type":"p","text":"• 게임·시설 운영","style":"Body Compact"},{"type":"p","text":"• 객실·부대시설 연계","style":"Body Compact"},{"type":"p","text":"• 이벤트·프로모션","style":"Body Compact"},{"type":"p","text":"• 매출·회원 관리","style":"Body Compact"},{"type":"p","text":"• 안전·컴플라이언스","style":"Body Compact"}],"4. 신입사원이 실제로 많이 맡는 업무":[{"type":"p","text":"• 고객서비스을 위한 자료수집·기초 데이터 정리","style":"Body Compact"},{"type":"p","text":"• 게임·시설 운영 관련 일정·문서·운영 보조","style":"Body Compact"},{"t  같은 활동에 흥미가 있다. □ pms/pos 등 직무 도구를 배우는 데 거부감이 적다. □ 리조트 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 리조트 성수기 고객동선·예약·부대시설 데이터를 분석해 대기시간과 객단가를 개선. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 5240 오락시설 서비스 종사원, 0141 숙박·여행·오락 및 스포츠 관련 관리자, 4204 스포츠 강사 및 트레이너 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 한국관광공사 2026년 일반직 신입사원 채용 : https://job.alio.go.kr/recruitview.do?idx=301369 • 롯데그룹 채용 : https://recruit.lotte.co.kr/ • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J32","name":"법률·법무·지식재산","intro":[{"type":"p","text":"법률·계약·소송·컴플라이언스와 특허·상표 등 지식재산을 관리해 조직의 권리와 위험을 보호하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑨ 법률·공공행정·공공안전·보안"],["한 줄 정의","법률·계약·소송·컴플라이언스와 특허·상표 등 지식재산을 관리해 조직의 권리와 위험을 보호하는 직무"],["신입 진입도","★★★☆☆ 보통~다소 어려움(직무증거·전문성 중요)"],["대표 시장직무명","법무, 컴플라이언스, IP Manager, 특허관리, Patent Engineer, Legal Assistant"],["주요 산업","전 산업, 로펌, 특허법인, R&D기업, 공공기관"],["NCS 기반","대표 NCS: 지식재산관리, 지식재산평가·거래, 지식재산정보조사분석, 특허엔지니어링 / 매핑 세분류 4개 / 능력단위 56개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["법률","계약 검토·법률자문 지원","계약 검토·법률자문 지원 관련 자료정리·운영지원·기초분석·현장보조"],["법무","분쟁·소송자료 관리","분쟁·소송자료 관리 관련 자료정리·운영지원·기초분석·현장보조"],["지식재산","법규·컴플라이언스 점검","법규·컴플라이언스 점검 관련 자료정리·운영지원·기초분석·현장보조"]]}],"3. 주요 업무":[{"type":"p","text":"• 계약 검토·법률자문 지원","style":"Body Compact"},{"type":"p","text":"• 분쟁·소송자료 관리","style":"Body Compact"},{"type":"p","text":"• 법규·컴플라이언스 점검","style":"Body Compact"},{"type":"p","text":"• 특허·상표 출원·관리","style":"Body Compact"},{"type":"p","text":"• 선행기술·IP 조사","style":"Body Compact"},{"type":"p","text":"• 기술가치·라이선스 지원", 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 관련 법령·제도와 채용요건 확인 • 3개월: 사례분석·직무기술서 기반 포트폴리오 • 6개월: 자격·시험·인턴·공공프로젝트 준비 • 대표 결과물: 신제품 출시 전 특허 선행조사와 계약 리스크를 검토해 침해·분쟁 가능성을 줄이는 대응안 작성 • 6개월 후 목표: 법무 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 법규해석을 활용하는 일을 비교적 즐긴다. □ 정확성이 요구되는 문제를 피하지 않는다. □ 계약 검토·법률자문 지원 같은 활동에 흥미가 있다. □ 법률db 등 직무 도구를 배우는 데 거부감이 적다. □ 전 산업 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 신제품 출시 전 특허 선행조사와 계약 리스크를 검토해 침해·분쟁 가능성을 줄이는 대응안 작성. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 2214 변리사 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 인천국제공항공사 2026년 신입직원 채용 : https://job.alio.go.kr/recruitview.do?idx=304492 • 한국특허정보원 2026년 직원 채용 : https://job.alio.go.kr/recruitview.do?idx=301672 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J33","name":"경찰·교정·국방·공공안전","intro":[{"type":"p","text":"법질서·교정·국방·공공안전을 위해 범죄예방·질서유지·수용관리·군사운영 등 국가 안전 기능을 수행하는 직무군","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑨ 법률·공공행정·공공안전·보안"],["한 줄 정의","법질서·교정·국방·공공안전을 위해 범죄예방·질서유지·수용관리·군사운영 등 국가 안전 기능을 수행하는 직무군"],["신입 진입도","★★☆☆☆ 어려움(자격·면허·전공 또는 제한된 신입자리)"],["대표 시장직무명","경찰공무원, 교정직, 보호직, 군무원, 장교·부사관, Public Safety Officer"],["주요 산업","경찰, 교정기관, 국방, 정부, 공공안전기관"],["NCS 기반","대표 NCS: 직접 매핑 부족 / 매핑 세분류 0개 / 능력단위 0개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["경찰","순찰·치안활동","순찰·치안활동 관련 자료정리·운영지원·기초분석·현장보조"],["교정","사건·사고 초기대응","사건·사고 초기대응 관련 자료정리·운영지원·기초분석·현장보조"],["국방","수사·자료작성 지원","수사·자료작성 지원 관련 자료정리·운영지원·기초분석·현장보조"],["공공안전","교정·보호관리","교정·보호관리 관련 자료정리·운영지원·기초분석·현장보조"]]}],"3 무 자료검색·요약, 초안 작성, 반복 문서화, 데이터 전처리·패턴 탐색 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 관련 법령·제도와 채용요건 확인 • 3개월: 사례분석·직무기술서 기반 포트폴리오 • 6개월: 자격·시험·인턴·공공프로젝트 준비 • 대표 결과물: 다중이용시설 행사에서 위험요인을 사전 점검하고 인력·동선·비상대응계획을 수립 • 6개월 후 목표: 경찰공무원 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 법규해석을 활용하는 일을 비교적 즐긴다. □ 정확성이 요구되는 문제를 피하지 않는다. □ 순찰·치안활동 같은 활동에 흥미가 있다. □ 공공안전 정보시스템 등 직무 도구를 배우는 데 거부감이 적다. □ 경찰 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 다중이용시설 행사에서 위험요인을 사전 점검하고 인력·동선·비상대응계획을 수립. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 b: ncs 직접 세분류가 부족하여 keco/ksco·공공기관 직무기술서로 보완 keco 연계 직접 매핑 부족 — 관련 공공 직무기술서로 보완 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 인천국제공항공사 2026년 신입직원 채용 : https://job.alio.go.kr/recruitview.do?idx=304492 • 한국특허정보원 2026년 직원 채용 : https://job.alio.go.kr/recruitview.do?idx=301672 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J34","name":"소방·재난안전","intro":[{"type":"p","text":"화재·재난·위험물 사고를 예방하고 소방시설·방재체계를 설계·점검하며 사고 발생 시 구조·구급·복구를 수행하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑨ 법률·공공행정·공공안전·보안"],["한 줄 정의","화재·재난·위험물 사고를 예방하고 소방시설·방재체계를 설계·점검하며 사고 발생 시 구조·구급·복구를 수행하는 직무"],["신입 진입도","★★★☆☆ 보통~다소 어려움(직무증거·전문성 중요)"],["대표 시장직무명","소방안전관리자, 소방설비, 방재엔지니어, 소방공무원, 재난안전, Fire Safety"],["주요 산업","공공기관, 건설, 시설관리, 플랜트, 소방전문업체"],["NCS 기반","대표 NCS: 소방시설설계·감리, 소방시설공사, 구조구급, 소방안전관리, 위험물운송·운반관리, 위험물안전관리, 화재감식평가, 방재시설 / 매핑 세분류 12개 / 능력단위 148개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["소방","소방시설 설계·점검","소방시설 설계·점검 관련 자료정리·운영지원·기초분석·현장보조"],["재난안전","위험물 관리","위험물 f/assistant 수준에서 소방시설 설계·점검·위험물 관리의 기초업무 수행 • 중기: 독립적으로 재난위험 분석·방재계획 수립을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 자료검색·요약, 초안 작성, 반복 문서화, 데이터 전처리·패턴 탐색 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 관련 법령·제도와 채용요건 확인 • 3개월: 사례분석·직무기술서 기반 포트폴리오 • 6개월: 자격·시험·인턴·공공프로젝트 준비 • 대표 결과물: 대형시설의 화재위험·피난동선·소방설비 상태를 점검해 개선 우선순위를 제시 • 6개월 후 목표: 소방안전관리자 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 법규해석을 활용하는 일을 비교적 즐긴다. □ 정확성이 요구되는 문제를 피하지 않는다. □ 소방시설 설계·점검 같은 활동에 흥미가 있다. □ 소방설계 cad 등 직무 도구를 배우는 데 거부감이 적다. □ 공공기관 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 대형시설의 화재위험·피난동선·소방설비 상태를 점검해 개선 우선순위를 제시. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 1581 소방공학 기술자 및 연구원, 1582 방재 기술자 및 연구원 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 인천국제공항공사 2026년 신입직원 채용 : https://job.alio.go.kr/recruitview.do?idx=304492 • 한국특허정보원 2026년 직원 채용 : https://job.alio.go.kr/recruitview.do?idx=301672 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J35","name":"경비·경호·보안","intro":[{"type":"p","text":"사람·시설·정보의 안전을 위해 출입통제·순찰·관제·경호·보안계획을 수행하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑨ 법률·공공행정·공공안전·보안"],["한 줄 정의","사람·시설·정보의 안전을 위해 출입통제·순찰·관제·경호·보안계획을 수행하는 직무"],["신입 진입도","★★★★★ 양호(신입·현장형 진입기회가 비교적 넓음)"],["대표 시장직무명","보안요원, 경호원, 보안관제, 시설보안, Security Officer, Security Supervisor"],["주요 산업","공항, 병원, 기업, 공공시설, 행사·경호"],["NCS 기반","대표 NCS: 항공보안, 보안, 경호 / 매핑 세분류 3개 / 능력단위 48개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점"  수준에서 출입통제·순찰·cctv·보안관제의 기초업무 수행 • 중기: 독립적으로 위험인물·상황 대응·경호계획·동선관리을 책임지는 specialist/senior • 장기: 팀/프로젝트 리더, 전문위원, 관리자 또는 인접 전문직·사업책임자로 확장 15. ai·자동화 영향 ai가 빠르게 보조할 업무 자료검색·요약, 초안 작성, 반복 문서화, 데이터 전처리·패턴 탐색 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 관련 법령·제도와 채용요건 확인 • 3개월: 사례분석·직무기술서 기반 포트폴리오 • 6개월: 자격·시험·인턴·공공프로젝트 준비 • 대표 결과물: 대형 행사 전 출입구·vip 동선·비상대피·관제 사각지대를 점검해 보안계획을 수립 • 6개월 후 목표: 보안요원 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 법규해석을 활용하는 일을 비교적 즐긴다. □ 정확성이 요구되는 문제를 피하지 않는다. □ 출입통제·순찰 같은 활동에 흥미가 있다. □ cctv/vms 등 직무 도구를 배우는 데 거부감이 적다. □ 공항 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 대형 행사 전 출입구·vip 동선·비상대피·관제 사각지대를 점검해 보안계획을 수립. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 5414 보안 관제원, 5411 경호원 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 인천국제공항공사 2026년 신입직원 채용 : https://job.alio.go.kr/recruitview.do?idx=304492 • 한국특허정보원 2026년 직원 채용 : https://job.alio.go.kr/recruitview.do?idx=301672 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J36","name":"육상·철도 운송","intro":[{"type":"p","text":"도로·철도에서 승객과 화물을 안전·정시로 이동시키고 운행·관제·차량운용을 관리하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑩ 운송·물류·SCM"],["한 줄 정의","도로·철도에서 승객과 화물을 안전·정시로 이동시키고 운행·관제·차량운용을 관리하는 직무"],["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["대표 시장직무명","기관사, 철도관제, 버스·화물 운송, 운행관리, 배차관리, Transport Operator"],["주요 산업","철도, 버스, 물류, 공공교통, 운송기업"],["NCS 기반","대표 NCS: 여객운송, 화물운송, 철도관제, 열차운용DIA, 철도운전, 기지내차량운전 / 매핑 세분류 6개 / 능력단위 83개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점 단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 운송·물류 프로세스와 안전기준 • 3개월: 물류 데이터/운영개선 프로젝트 • 6개월: 현장실습·자격·scm/운송 인턴 • 대표 결과물: 열차 지연·선로상황·승객혼잡 정보를 종합해 운행순서와 안내를 조정 • 6개월 후 목표: 기관사 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 상황판단을 활용하는 일을 비교적 즐긴다. □ 운영관리이 요구되는 문제를 피하지 않는다. □ 차량·열차 운전 같은 활동에 흥미가 있다. □ 관제시스템 등 직무 도구를 배우는 데 거부감이 적다. □ 철도 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 열차 지연·선로상황·승객혼잡 정보를 종합해 운행순서와 안내를 조정. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 6213 철도 및 전동차 기관사, 6222 버스 운전원, 6223 화물차 및 특수차 운전원, 6219 철도운송 관련 종사원 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 인천국제공항공사 2026년 신입직원 채용 : https://job.alio.go.kr/recruitview.do?idx=304492 • 한국교통안전공단 2026년 철도 분야 채용 : https://job.alio.go.kr/recruitview.do?idx=302133 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J37","name":"해상·항공 운송","intro":[{"type":"p","text":"선박·항공기의 안전한 운항을 위해 조종·항해·기관·관제·운항지원 업무를 수행하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑩ 운송·물류·SCM"],["한 줄 정의","선박·항공기의 안전한 운항을 위해 조종·항해·기관·관제·운항지원 업무를 수행하는 직무"],["신입 진입도","★★☆☆☆ 어려움(자격·면허·전공 또는 제한된 신입자리)"],["대표 시장직무명","항공기 조종사, 운항관리사, 항공교통관제, 항해사, 기관사, 해상교통관제"],["주요 산업","항공사, 공항, 해운, 항만, 해양공공기관"],["NCS 기반","대표 NCS: 항해, 선박기관운전, 선박통신, 수면비행선박조종, 수상레저기구조종, 선박교통관제, 선박갑판관리, 검수·검정 / 매핑 세분류 18개 / 능력단위 211개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["해상","항공기 조종·운항지원","항공기 조종·운항지원 관련 자료정리·운영지원·기초분석·현장보조"],["항공 운송","항해·선박운항","항해·선박운항 관련 자료정리·운영지원·기초분석·현장보조"]]}],"3. 주요 업무":[{"type":"p","text":"• 항공기 조종·운항지원","styl 과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 운송·물류 프로세스와 안전기준 • 3개월: 물류 데이터/운영개선 프로젝트 • 6개월: 현장실습·자격·scm/운송 인턴 • 대표 결과물: 기상·공항·항로·연료 조건을 검토해 안전성과 정시성을 충족하는 비행계획을 수립 • 6개월 후 목표: 항공기 조종사 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 상황판단을 활용하는 일을 비교적 즐긴다. □ 운영관리이 요구되는 문제를 피하지 않는다. □ 항공기 조종·운항지원 같은 활동에 흥미가 있다. □ 항법·항공전자 등 직무 도구를 배우는 데 거부감이 적다. □ 항공사 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 기상·공항·항로·연료 조건을 검토해 안전성과 정시성을 충족하는 비행계획을 수립. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 6211 항공기 조종사, 6212 선장 및 항해사·도선사 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 인천국제공항공사 2026년 신입직원 채용 : https://job.alio.go.kr/recruitview.do?idx=304492 • 한국교통안전공단 2026년 철도 분야 채용 : https://job.alio.go.kr/recruitview.do?idx=302133 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J38","name":"물류·SCM·창고·배송","intro":[{"type":"p","text":"원자재부터 고객까지의 물류 흐름을 계획하고 재고·창고·운송·배송을 최적화하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑩ 운송·물류·SCM"],["한 줄 정의","원자재부터 고객까지의 물류 흐름을 계획하고 재고·창고·운송·배송을 최적화하는 직무"],["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["대표 시장직무명","SCM, 물류기획, 물류운영, 재고관리, Warehouse Manager, Supply Planner"],["주요 산업","제조, 유통, 이커머스, 3PL, 식품"],["NCS 기반","대표 NCS: SCM, 물류기획, 운송관리, 보관·하역관리, 수송포장, 스마트물류체계기획, 스마트물류플랫폼구축, 스마트물류통합관리 / 매핑 세분류 8개 / 능력단위 69개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["물류","수요·재고 계획","수요·재고 계획 관련 자료정리·운영지원·기초분석·현장보조"],["SCM","SCM 운영","SCM 운영 관련 자료정리·운영지원·기초분석·현장보조"],["창고","운송·배차 관리","운송·배차 관리 관련 자료정리·운영지원·기초분석·현장보조"],["배송","창고·하역 운영","창고·하역 운영 관련 자료정리·운영지원·기초분석·현장보조"]]}],"3. 주요 업무":[{"type":"p","text":"•  전처리·패턴 탐색 사람의 핵심역할 문제정의, 맥락 판단, 책임 있는 의사결정, 이해관계자 조정, 윤리·안전 검증 대학생 준비 포인트 ai 도구 사용 자체보다 출처검증·데이터 품질·도메인 지식·결과물 책임성을 함께 증명 16. 1·3·6개월 준비 roadmap • 1개월: 운송·물류 프로세스와 안전기준 • 3개월: 물류 데이터/운영개선 프로젝트 • 6개월: 현장실습·자격·scm/운송 인턴 • 대표 결과물: sku별 판매·재고·리드타임을 분석해 안전재고와 발주주기를 조정해 결품과 재고비를 줄임 • 6개월 후 목표: scm 지원용 포트폴리오 2~3개 + 직무경험 1개 이상 17. 자기진단 체크리스트 □ 상황판단을 활용하는 일을 비교적 즐긴다. □ 운영관리이 요구되는 문제를 피하지 않는다. □ 수요·재고 계획 같은 활동에 흥미가 있다. □ erp/sap 등 직무 도구를 배우는 데 거부감이 적다. □ 제조 분야의 뉴스·현장·서비스에 관심이 있다. □ 정확한 기록·기한·책임을 지키며 협업할 수 있다. 판단 예시: 6개 중 4개 이상이면 우선 탐색직무로 검토. 단, 이는 선별검사가 아니라 탐색용 체크리스트입니다. 18. 실무 사례 sku별 판매·재고·리드타임을 분석해 안전재고와 발주주기를 조정해 결품과 재고비를 줄임. 포트폴리오 구성: 상황/문제 → 사용한 데이터·도구 → 본인의 역할 → 분석/설계 → 결과·성과 → 개선점. 19. 근거자료·검증 검증등급 a: ncs 직접 매핑 + keco 직업명 + 2026 채용시장 사례 교차확인 keco 연계 0289 기타 운송 및 무역 사무원, 6245 하역 및 적재 단순 종사원 확인일 2026-09-09 • 국가직무능력표준(ncs) : https://www.ncs.go.kr/ • 고용24 직업·채용정보 : https://www.work24.go.kr/ • 인천국제공항공사 2026년 신입직원 채용 : https://job.alio.go.kr/recruitview.do?idx=304492 • 한국교통안전공단 2026년 철도 분야 채용 : https://job.alio.go.kr/recruitview.do?idx=302133 • 세계경제포럼 future of jobs report 2025 : https://www.weforum.org/publications/the-future-of-jobs-report-2025/ • ilo generative ai and jobs 2025 : https://www.ilo.org/publications/generative-ai-and-jobs-2025-update"},{"code":"J39","name":"건축·도시·조경","intro":[{"type":"p","text":"건축물·도시·조경·교통공간을 사람의 기능·안전·환경 요구에 맞게 계획·설계하는 직무","style":"Body Compact"}],"sections":{"1. 직무 한눈에 보기":[{"type":"table","rows":[["상위직군","⑪ 건설·시설·환경·에너지·안전"],["한 줄 정의","건축물·도시·조경·교통공간을 사람의 기능·안전·환경 요구에 맞게 계획·설계하는 직무"],["신입 진입도","★★★★☆ 보통~양호(신입·인턴 진입경로 비교적 확인됨)"],["대표 시장직무명","건축설계, 도시설계, 조경설계, 교통계획, BIM, Architectural Designer"],["주요 산업","건축사사무소, 건설, 공공개발, 엔지니어링, 부동산개발"],["NCS 기반","대표 NCS: 부동산개발, 건축공사감리, 건축구조설계, 건축설계, 실내건축설계, 교통계획, 교통설계, 교통운영·감리 / 매핑 세분류 22개 / 능력단위 274개"]]}],"2. 세부 직무와 핵심 초점":[{"type":"table","rows":[["세부 영역","핵심 초점","신입이 먼저 접하기 쉬운 업무"],["건축","건축·도시 기획","건축·도시 기획 관련 자료정리·운영지원·기초분석·현장보조"],["도시","건축·실내 설계","건축·실내 설계 관련 자료정리·운영지원·기초분석·현장보조"],["조경","구조·법규 검토
